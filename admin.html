<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团长后台系统 🛠️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f2f5; --pink: #ffb7c5; }
        body { font-family: system-ui; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .login-box { max-width: 400px; margin: 100px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        nav { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .btn-primary { background: var(--main); color: #fff; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-danger { background: #ff7675; color: #fff; }
        .stats-badge { padding: 5px 10px; border-radius: 20px; background: #eee; font-size: 12px; margin-right: 5px; }
        #initGuide { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 登录模块 -->
    <div id="loginSection" class="login-box">
        <h2 style="text-align:center">🎀 团长登录</h2>
        <input type="email" id="email" placeholder="邮箱">
        <input type="password" id="pw" placeholder="密码">
        <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="login()">登录</button>
    </div>

    <!-- 初始化引导 -->
    <div id="initGuide" class="hidden">
        <div class="card" style="color:#333; width: 300px;">
            <h3>✨ 欢迎新团长</h3>
            <p>请设置你的查询密钥（发给团员用的）：</p>
            <input type="text" id="newQueryKey" placeholder="例如：endfield">
            <button class="btn btn-primary" onclick="initSystem()">完成初始化</button>
        </div>
    </div>

    <!-- 后台管理主体 -->
    <div id="adminSection" class="hidden">
        <nav>
            <strong id="roleTag">团长后台</strong>
            <div>
                <span id="userEmail" style="margin-right:15px; font-size:14px"></span>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </nav>
        <div class="main-content">
            <div class="card" style="margin-bottom:20px;">
                <h3>📊 全团概览</h3>
                <div id="statsArea"></div>
            </div>
            <div class="grid">
                <div class="card">
                    <h3>✍️ 排单录入/编辑</h3>
                    <input type="hidden" id="editItemId">
                    <label>谷子名称</label><input type="text" id="itemName">
                    <label>地区</label>
                    <select id="itemCountry">
                        <option>国内</option><option>台湾</option><option>泰国</option><option>印尼</option>
                        <option>美国</option><option>日本</option><option>韩国</option>
                    </select>
                    <label>团员 CN</label><input type="text" id="itemCN">
                    <div style="display:flex; gap:10px">
                        <div><label>单价</label><input type="number" id="itemPrice" step="0.01"></div>
                        <div><label>数量</label><input type="number" id="itemQty" value="1"></div>
                    </div>
                    <label>状态</label>
                    <select id="itemStatus" onchange="checkStatusChange(this.value)">
                        <option>未出荷</option><option>已下单未到货</option><option>回国中</option>
                        <option>已到货</option><option>可排发</option><option>已排发</option><option>未付款</option>
                    </select>
                    <div id="expiryInput" class="hidden">
                        <label style="color:red">⚠️ 请设置囤货到期日</label>
                        <input type="date" id="itemExpiry">
                    </div>
                    <label>柄图</label>
                    <input type="file" id="itemFile" accept="image/*">
                    <button class="btn btn-pink" style="width:100%; margin-top:15px" onclick="saveItem()">保存记录</button>
                    <button class="btn" style="width:100%; margin-top:5px" onclick="clearForm()">重置清空</button>
                </div>
                <div id="ownerSettings" class="card hidden">
                    <h3>⚙️ 团务设置</h3>
                    <p>查询密钥：<strong id="dispKey" style="color:var(--main)"></strong></p>
                    <hr>
                    <h4>副团长管理 (上限3人)</h4>
                    <div id="coAdminList"></div>
                    <div style="margin-top:10px">
                        <input type="email" id="newAdminEmail" placeholder="输入副团长账号邮箱">
                        <button class="btn btn-primary" onclick="addAdmin()">添加副团员</button>
                    </div>
                </div>
            </div>
            <div class="card" style="margin-top:20px; overflow-x:auto;">
                <h3>📜 全团排单明细</h3>
                <table>
                    <thead><tr><th>柄图</th><th>名称</th><th>CN</th><th>单价×数量</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ======= 【此处填入你自己的信息】 =======
        const SUPABASE_URL = 'https://oknhlfhdqbsukskdxqre.supabase.co';
        const SUPABASE_KEY = '这里填入那串eyJ开头的超长密钥'; 
        // =====================================

        const supabaseClient = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y);
        let currentData = null; 
        let currentUser = null;

        // 登录
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pw').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("登录失败：" + error.message);
            else checkAuth();
        }

        // 退出
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // 权限与状态检查（已修正逻辑）
        async function checkAuth() {
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            
            if (!user || authError) {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminSection').classList.add('hidden');
                document.getElementById('initGuide').classList.add('hidden');
                return;
            }

            currentUser = user;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;

            const { data: records, error: dbError } = await supabaseClient.from('leader_data').select('*');
            
            if (dbError) {
                console.error(dbError.message);
                return;
            }

            if (records && records.length > 0) {
                currentData = records[0];
                document.getElementById('initGuide').classList.add('hidden');
                renderUI();
            } else {
                document.getElementById('initGuide').classList.remove('hidden');
            }
        }

        // 初始化系统
        async function initSystem() {
            const key = document.getElementById('newQueryKey').value.trim();
            if(!key) return alert("请输入密钥");
            const { error } = await supabaseClient.rpc('init_leader_data', { p_query_key: key });
            if(error) alert("初始化失败: " + error.message);
            else location.reload();
        }

        // 渲染界面
        function renderUI() {
            const isOwner = currentData.user_id === currentUser.id;
            if (isOwner) {
                document.getElementById('ownerSettings').classList.remove('hidden');
                document.getElementById('dispKey').innerText = currentData.query_key;
                renderAdmins();
            }
            document.getElementById('roleTag').innerText = isOwner ? "团长后台" : "副团长后台";
            const list = currentData.group_data || [];
            const totalSum = list.reduce((s, i) => s + (i.price * i.quantity), 0);
            const statusCount = {};
            list.forEach(i => statusCount[i.status] = (statusCount[i.status] || 0) + 1);
            let statsHtml = `<strong>总项数: ${list.length}</strong> | <strong>总金额: ￥${totalSum.toFixed(2)}</strong><br><div style="margin-top:10px">`;
            for(let s in statusCount) statsHtml += `<span class="stats-badge">${s}: ${statusCount[s]}</span>`;
            document.getElementById('statsArea').innerHTML = statsHtml + "</div>";
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = list.map((item) => `
                <tr>
                    <td><img src="${item.image_url || ''}" class="img-preview"></td>
                    <td>${item.name}<br><small>${item.country}</small></td>
                    <td>${item.cn}</td>
                    <td>￥${item.price} × ${item.quantity}</td>
                    <td><span class="stats-badge">${item.status}</span></td>
                    <td>
                        <button onclick="editItem('${item.item_id}')">编辑</button>
                        <button style="color:red" onclick="deleteItem('${item.item_id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 保存/上传
        async function saveItem() {
            const file = document.getElementById('itemFile').files[0];
            let imageUrl = document.getElementById('editItemId').dataset.img || "";
            if (file) {
                const fileName = `${Date.now()}_${file.name}`;
                const { data, error } = await supabaseClient.storage.from('images').upload(fileName, file);
                if (error) return alert("图片上传失败");
                imageUrl = `${SUPABASE_URL}/storage/v1/object/public/images/${fileName}`;
            }
            const newItem = {
                item_id: document.getElementById('editItemId').value || Date.now().toString(),
                name: document.getElementById('itemName').value,
                country: document.getElementById('itemCountry').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQty').value) || 1,
                cn: document.getElementById('itemCN').value,
                status: document.getElementById('itemStatus').value,
                image_url: imageUrl,
                storage_expiry: document.getElementById('itemExpiry').value || null,
                created_at: new Date().toISOString()
            };
            let newList = [...(currentData.group_data || [])];
            const idx = newList.findIndex(i => i.item_id === newItem.item_id);
            if (idx > -1) newList[idx] = newItem; else newList.push(newItem);
            const { error } = await supabaseClient.from('leader_data').update({ group_data: newList }).eq('id', currentData.id);
            if (error) alert("保存失败"); else { alert("保存成功！"); location.reload(); }
        }

        function editItem(id) {
            const item = currentData.group_data.find(i => i.item_id === id);
            document.getElementById('editItemId').value = item.item_id;
            document.getElementById('editItemId').dataset.img = item.image_url;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCountry').value = item.country;
            document.getElementById('itemCN').value = item.cn;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemQty').value = item.quantity;
            document.getElementById('itemStatus').value = item.status;
            document.getElementById('itemExpiry').value = item.storage_expiry || "";
            checkStatusChange(item.status);
            window.scrollTo(0, 0);
        }

        async function deleteItem(id) {
            if(!confirm("确定删除吗？")) return;
            const newList = currentData.group_data.filter(i => i.item_id !== id);
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('id', currentData.id);
            location.reload();
        }

        function checkStatusChange(val) {
            const area = document.getElementById('expiryInput');
            if(val === "可排发") area.classList.remove('hidden'); else area.classList.add('hidden');
        }

        async function addAdmin() {
            const email = document.getElementById('newAdminEmail').value;
            const { data, error } = await supabaseClient.rpc('add_co_admin', { p_query_key: currentData.query_key, p_email: email });
            alert(data || error.message); location.reload();
        }

        function renderAdmins() {
            const list = currentData.admin_ids || [];
            document.getElementById('coAdminList').innerHTML = list.length ? list.map(id => `<div>UID: ${id.substring(0,8)}... <button onclick="removeAdmin('${id}')">移除</button></div>`).join('') : "暂无副团长";
        }

        async function removeAdmin(uid) {
            await supabaseClient.rpc('remove_co_admin', { p_query_key: currentData.query_key, p_admin_id: uid });
            location.reload();
        }

        function clearForm() {
            document.getElementById('editItemId').value = "";
            document.getElementById('itemName').value = "";
            document.getElementById('itemCN').value = "";
            document.getElementById('itemFile').value = "";
            document.getElementById('editItemId').dataset.img = "";
        }

        checkAuth();
    </script>
</body>
</html>
