<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>团长专属后台管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .login-box { max-width: 400px; margin: 100px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .admin-container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; }
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 16px; cursor: pointer; font-weight: bold; color: #666; }
        .tab-btn.active { color: #ff6b81; border-bottom: 2px solid #ff6b81; margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #f8f9fa; }
        button { padding: 6px 12px; background: #ff6b81; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        button:hover { background: #ff4757; }
        .btn-secondary { background: #70a1ff; }
        .btn-secondary:hover { background: #1e90ff; }
        .btn-danger { background: #ff4757; }
        .form-panel { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .form-panel input, .form-panel select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .stats-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #f1f2f6; padding: 15px 25px; border-radius: 8px; flex: 1; text-align: center; }
        .card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; color: #ff6b81; }
    </style>
</head>
<body>

<!-- 登录界面 -->
<div id="loginPage" class="login-box">
    <h2>团长后台登录</h2>
    <p style="font-size: 13px; color: #666;">请输入后台管理密码</p>
    <input type="password" id="adminPassword" placeholder="请输入密码">
    <button onclick="handleLogin()" style="width: 100%;">登录后台</button>
</div>

<!-- 后台主界面 -->
<div id="adminPage" class="admin-container">
    <h2>👑 团长工作后台</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">排表管理</button>
        <button class="tab-btn" onclick="switchTab(1)">排发工作台</button>
        <button class="tab-btn" onclick="switchTab(2)">转单记录</button>
        <button class="tab-btn" onclick="switchTab(3)">团务设置</button>
    </div>

    <!-- 标签页 1：排表管理 -->
    <div class="tab-content active">
        <h3>录入 / 编辑谷子</h3>
        <div class="form-panel">
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="itemName" placeholder="谷子名称">
            <input type="text" id="itemCn" placeholder="CN">
            <input type="number" id="itemPrice" placeholder="单价" style="width: 80px;">
            <input type="number" id="itemQty" placeholder="数量" style="width: 70px;" value="1">
            <select id="itemRegion">
                <option value="日本">日本</option>
                <option value="闲鱼">闲鱼</option>
                <option value="淘宝店">淘宝店</option>
                <option value="美国">美国</option>
                <option value="韩国">韩国</option>
                <option value="印尼">印尼</option>
                <option value="泰国">泰国</option>
                <option value="台湾">台湾</option>
            </select>
            <select id="itemStatus">
                <option value="未排">未排</option>
                <option value="可排发">可排发</option>
                <option value="已申请发货">已申请发货</option>
                <option value="已排发">已排发</option>
            </select>
            <button onclick="saveItem()">保存谷子</button>
            <button class="btn-secondary" onclick="resetForm()">清空表单</button>
        </div>

        <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="font-size: 13px;">
            <select id="defaultExcelRegion">
                <option value="日本">默认地区：日本</option>
                <option value="闲鱼">默认地区：闲鱼</option>
                <option value="淘宝店">默认地区：淘宝店</option>
                <option value="美国">默认地区：美国</option>
                <option value="韩国">默认地区：韩国</option>
                <option value="印尼">默认地区：印尼</option>
                <option value="泰国">默认地区：泰国</option>
                <option value="台湾">默认地区：台湾</option>
            </select>
            <button class="btn-secondary" onclick="importExcel()">Excel 批量导入</button>
            <input type="text" id="searchInput" placeholder="搜索名称或CN..." oninput="renderTable()" style="padding: 6px; border:1px solid #ddd; border-radius:4px;">
        </div>

        <div style="margin-bottom: 10px; display: flex; gap: 10px;">
            <button class="btn-danger" onclick="batchDeleteItems()">批量删除</button>
            <button class="btn-secondary" onclick="batchChangeStatus('可排发')">批量改状态为:可排发</button>
            <button class="btn-secondary" onclick="batchChangeRegion('日本')">批量改地区为:日本</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th width="30"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                        <th>名称</th><th>CN</th><th>单价</th><th>数量</th><th>地区</th><th>状态</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 标签页 2：排发工作台 -->
    <div class="tab-content">
        <div class="stats-cards">
            <div class="card">
                <h3>待处理申请数</h3>
                <p id="pendingCount">0</p>
            </div>
            <div class="card">
                <h3>已完成记录数</h3>
                <p id="completedCount">0</p>
            </div>
        </div>
        <div style="margin-bottom: 15px;">
            <button id="btnPendingTab" onclick="switchAppView('pending')" class="btn-secondary">待处理申请</button>
            <button id="btnCompletedTab" onclick="switchAppView('completed')" style="background:#ccc;">已完成记录</button>
        </div>
        <div id="applicationsArea"></div>
    </div>

    <!-- 标签页 3：转单记录 -->
    <div class="tab-content">
        <div style="margin-bottom: 10px;">
            <button class="btn-danger" onclick="batchDeleteTransLogs()">批量删除转单记录</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th width="30"><input type="checkbox" id="selectAllTrans" onclick="toggleSelectAllTrans(this)"></th>
                        <th>转单日志详情</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="transLogsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 标签页 4：团务设置 -->
    <div class="tab-content">
        <h3>团务基本设置</h3>
        <div class="form-panel" style="flex-direction: column; align-items: flex-start;">
            <label style="font-weight: bold;">当前团员查询密钥 (Query Key):</label>
            <div style="display: flex; gap: 10px; width: 100%; margin-top: 5px;">
                <input type="text" id="settingQueryKey" style="flex: 1;" placeholder="输入密钥">
                <button onclick="saveQueryKey()">保存密钥</button>
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 5px;">团员在查谷和申请排发时必须输入此密钥才能验证成功。</p>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://oknhlfhdqbsukskdxqre.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let dbGlobalData = { items: [], applications: [], transfer_logs: [], query_key: "" };
    let currentAppView = "pending";

    async function handleLogin() {
        const pwd = document.getElementById('adminPassword').value;
        // 简单设个团长管理密码，例如 123456，或者可自行更改
        if (pwd === "123456" || pwd === "admin") {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            await loadAllDataFromSupabase();
        } else {
            alert("密码错误！初始测试密码为：123456");
        }
    }

    async function loadAllDataFromSupabase() {
        const { data, error } = await supabaseClient.from('leader_data').select('*').eq('id', 1).single();
        if (error) {
            console.error(error);
            // 如果表里没数据，初始化一行
            await supabaseClient.from('leader_data').insert([{ id: 1, items: [], applications: [], transfer_logs: [], query_key: "8888" }]);
            dbGlobalData = { items: [], applications: [], transfer_logs: [], query_key: "8888" };
        } else if (data) {
            dbGlobalData = {
                items: data.items || [],
                applications: data.applications || [],
                transfer_logs: data.transfer_logs || [],
                query_key: data.query_key || ""
            };
        }
        document.getElementById('settingQueryKey').value = dbGlobalData.query_key;
        renderTable();
        renderApplications();
        renderTransferLogs();
    }

    async function syncToSupabase() {
        const { error } = await supabaseClient.from('leader_data').update({
            items: dbGlobalData.items,
            applications: dbGlobalData.applications,
            transfer_logs: dbGlobalData.transfer_logs,
            query_key: dbGlobalData.query_key
        }).eq('id', 1);

        if (error) {
            alert("同步数据库出错: " + error.message);
        }
    }

    function switchTab(index) {
        const btns = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        btns.forEach((b, i) => {
            b.classList.toggle('active', i === index);
            contents[i].classList.toggle('active', i === index);
        });
    }

    // --- 标签页 1：排表管理 ---
    async function saveItem() {
        const editIdx = parseInt(document.getElementById('editIndex').value);
        const name = document.getElementById('itemName').value.trim();
        const cn = document.getElementById('itemCn').value.trim();
        const price = parseFloat(document.getElementById('itemPrice').value) || 0;
        const quantity = parseInt(document.getElementById('itemQty').value) || 1;
        const region = document.getElementById('itemRegion').value;
        const status = document.getElementById('itemStatus').value;

        if (!name || !cn) { alert("谷子名称和 CN 不能为空！"); return; }

        const itemObj = { name, cn, price, quantity, region, status };

        if (editIdx === -1) {
            dbGlobalData.items.push(itemObj);
        } else {
            dbGlobalData.items[editIdx] = itemObj;
        }

        await syncToSupabase();
        resetForm();
        renderTable();
    }

    function resetForm() {
        document.getElementById('editIndex').value = "-1";
        document.getElementById('itemName').value = "";
        document.getElementById('itemCn').value = "";
        document.getElementById('itemPrice').value = "";
        document.getElementById('itemQty').value = "1";
    }

    function renderTable() {
        const tbody = document.getElementById('itemsTableBody');
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        tbody.innerHTML = "";

        dbGlobalData.items.forEach((item, index) => {
            const match = (item.name && item.name.toLowerCase().includes(keyword)) || (item.cn && item.cn.toLowerCase().includes(keyword));
            if (keyword && !match) return;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="item-checkbox" value="${index}"></td>
                <td>${item.name || ''}</td>
                <td>${item.cn || ''}</td>
                <td>${item.price || 0}</td>
                <td>${item.quantity || 1}</td>
                <td>${item.region || ''}</td>
                <td>${item.status || ''}</td>
                <td>
                    <button onclick="editItem(${index})">修改</button>
                    <button class="btn-secondary" onclick="transferItemModal(${index})">转单</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editItem(index) {
        const item = dbGlobalData.items[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemCn').value = item.cn;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemQty').value = item.quantity;
        document.getElementById('itemRegion').value = item.region;
        document.getElementById('itemStatus').value = item.status;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function transferItemModal(index) {
        const item = dbGlobalData.items[index];
        const newCn = prompt(`请输入要将此谷子【${item.name}】转给的新 CN：`, "");
        if (!newCn) return;

        const oldCn = item.cn;
        item.cn = newCn;

        const logText = `[转单] 谷子「${item.name}」由 CN [${oldCn}] 转给 CN [${newCn}]，时间：${new Date().toLocaleString()}`;
        dbGlobalData.transfer_logs.push(logText);

        await syncToSupabase();
        renderTable();
        renderTransferLogs();
        alert("转单成功！");
    }

    function toggleSelectAll(master) {
        const boxes = document.querySelectorAll('.item-checkbox');
        boxes.forEach(b => b.checked = master.checked);
    }

    async function batchDeleteItems() {
        const checked = document.querySelectorAll('.item-checkbox:checked');
        if (checked.length === 0) { alert("请选择要删除的谷子"); return; }
        if (!confirm("确定要批量删除选中的谷子吗？")) return;

        const indices = Array.from(checked).map(b => parseInt(b.value)).sort((a,b)=>b-a);
        indices.forEach(idx => dbGlobalData.items.splice(idx, 1));

        await syncToSupabase();
        renderTable();
    }

    async function batchChangeStatus(newStatus) {
        const checked = document.querySelectorAll('.item-checkbox:checked');
        if (checked.length === 0) { alert("请选择谷子"); return; }
        checked.forEach(b => {
            dbGlobalData.items[parseInt(b.value)].status = newStatus;
        });
        await syncToSupabase();
        renderTable();
        alert("批量修改状态成功！");
    }

    async function batchChangeRegion(newRegion) {
        const checked = document.querySelectorAll('.item-checkbox:checked');
        if (checked.length === 0) { alert("请选择谷子"); return; }
        checked.forEach(b => {
            dbGlobalData.items[parseInt(b.value)].region = newRegion;
        });
        await syncToSupabase();
        renderTable();
        alert("批量修改地区成功！");
    }

    // Excel 导入
    function importExcel() {
        const fileInput = document.getElementById('excelFile');
        const defaultRegion = document.getElementById('defaultExcelRegion').value;
        if (fileInput.files.length === 0) { alert("请选择 Excel 文件"); return; }

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = async function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.SheetNames;
            const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

            sheetData.forEach(row => {
                // 兼容常见字段：名称/谷名, CN/昵称, 单价/价格, 数量, 地区
                const name = row['名称'] || row['谷名'] || row['Item'] || '';
                const cn = row['CN'] || row['昵称'] || '';
                const price = parseFloat(row['单价'] || row['价格'] || 0);
                const quantity = parseInt(row['数量'] || 1);
                const region = row['地区'] || defaultRegion;
                const status = row['状态'] || '未排';

                if (name && cn) {
                    dbGlobalData.items.push({ name, cn, price, quantity, region, status });
                }
            });

            await syncToSupabase();
            renderTable();
            alert("Excel 批量导入成功！");
        };
        reader.readAsArrayBuffer(file);
    }

    // --- 标签页 2：排发工作台 ---
    function switchAppView(view) {
        currentAppView = view;
        document.getElementById('btnPendingTab').style.background = (view === 'pending') ? '#70a1ff' : '#ccc';
        document.getElementById('btnCompletedTab').style.background = (view === 'completed') ? '#70a1ff' : '#ccc';
        renderApplications();
    }

    function renderApplications() {
        const apps = dbGlobalData.applications || [];
        const pendingList = apps.filter(a => a.status === "待处理");
        const completedList = apps.filter(a => a.status === "已完成");

        document.getElementById('pendingCount').innerText = pendingList.length;
        document.getElementById('completedCount').innerText = completedList.length;

        const targetList = (currentAppView === 'pending') ? pendingList : completedList;
        const area = document.getElementById('applicationsArea');

        if (targetList.length === 0) {
            area.innerHTML = "<p style='color:#666;'>暂无相关申请记录。</p>";
            return;
        }

        let html = "";
        targetList.forEach((app, appIdx) => {
            // 在原数组里的真实索引
            const realIndex = apps.indexOf(app);
            
            // 每 10 个谷子一行切分
            let itemsChunks = [];
            for (let i = 0; i < app.items.length; i += 10) {
                itemsChunks.push(app.items.slice(i, i + 10));
            }

            html += `<div style="background:#f8f9fa; border:1px solid #ddd; border-radius:6px; padding:15px; margin-bottom:15px;">
                <p style="margin:0 0 5px 0; font-weight:bold;">CN: ${app.cn} | 时间: ${app.time} | 状态: <span style="color:${app.status==='待处理'?'#ff4757':'#2ed573'}">${app.status}</span></p>
                <p style="margin:0 0 10px 0; font-size:13px; color:#555;">备注: ${app.note || '无'}</p>
                <p style="margin:0 0 5px 0; font-size:13px; font-weight:bold;">申请明细：</p>`;

            itemsChunks.forEach((chunk, chunkIdx) => {
                html += `<div style="font-size:12px; background:#fff; padding:6px; border:1px solid #eee; margin-bottom:4px;">
                    <strong>第 ${chunkIdx + 1} 组 (10个/行):</strong> ${chunk.map(ci => `[${ci.name} × ${ci.quantity}]`).join(', ')}
                </div>`;
            });

            html += `<div style="margin-top:10px; display:flex; gap:10px;">`;
            if (app.status === "待处理") {
                html += `<button onclick="confirmApp(${realIndex})">确认发货</button>`;
                html += `<button class="btn-danger" onclick="deleteApp(${realIndex})">删除申请</button>`;
            } else {
                html += `<button class="btn-danger" onclick="deleteCompletedApp(${realIndex})">删除记录（联动清理排表）</button>`;
            }
            html += `</div></div>`;
        });

        area.innerHTML = html;
    }

    async function confirmApp(realIndex) {
        const app = dbGlobalData.applications[realIndex];
        app.status = "已完成";

        // 将对应排表谷子状态改为 "已排发"
        app.items.forEach(appItem => {
            const tableItem = dbGlobalData.items[appItem.item_id];
            if (tableItem) {
                tableItem.status = "已排发";
            }
        });

        await syncToSupabase();
        renderApplications();
        renderTable();
        alert("已确认发货，对应谷子状态已自动变更为【已排发】！");
    }

    async function deleteApp(realIndex) {
        if (!confirm("确定删除该待处理申请吗？")) return;
        dbGlobalData.applications.splice(realIndex, 1);
        await syncToSupabase();
        renderApplications();
    }

    async function deleteCompletedApp(realIndex) {
        if (!confirm("确定删除该已完成记录吗？这将同步联动删除排表中的相关谷子！")) return;
        const app = dbGlobalData.applications[realIndex];

        // 收集该申请中关联的 item_id，并从 items 中彻底剔除
        const itemIdsToDelete = app.items.map(i => i.item_id).sort((a,b)=>b-a);
        itemIdsToDelete.forEach(id => {
            if (dbGlobalData.items[id]) {
                dbGlobalData.items.splice(id, 1);
            }
        });

        dbGlobalData.applications.splice(realIndex, 1);

        await syncToSupabase();
        renderApplications();
        renderTable();
        alert("已完成记录及关联排表谷子已彻底删除！");
    }

    // --- 标签页 3：转单记录 ---
    function renderTransferLogs() {
        const tbody = document.getElementById('transLogsTableBody');
        const logs = dbGlobalData.transfer_logs || [];
        tbody.innerHTML = "";

        logs.forEach((log, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="trans-checkbox" value="${index}"></td>
                <td>${log}</td>
                <td><button class="btn-danger" onclick="deleteOneTransLog(${index})">删除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function toggleSelectAllTrans(master) {
        const boxes = document.querySelectorAll('.trans-checkbox');
        boxes.forEach(b => b.checked = master.checked);
    }

    async function deleteOneTransLog(index) {
        dbGlobalData.transfer_logs.splice(index, 1);
        await syncToSupabase();
        renderTransferLogs();
    }

    async function batchDeleteTransLogs() {
        const checked = document.querySelectorAll('.trans-checkbox:checked');
        if (checked.length === 0) { alert("请选择要删除的记录"); return; }
        if (!confirm("确定批量删除选中的转单日志吗？")) return;

        const indices = Array.from(checked).map(b => parseInt(b.value)).sort((a,b)=>b-a);
        indices.forEach(idx => dbGlobalData.transfer_logs.splice(idx, 1));

        await syncToSupabase();
        renderTransferLogs();
    }

    // --- 标签页 4：团务设置 ---
    async function saveQueryKey() {
        const newKey = document.getElementById('settingQueryKey').value.trim();
        dbGlobalData.query_key = newKey;
        await syncToSupabase();
