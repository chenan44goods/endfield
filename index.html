<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷子排单自查系统 🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 🎨 以后想换背景，只需改下面这一行引号里的链接即可 */
        :root { 
            --bg-url: url('https://oknhlfhdqbsukskdxqre.supabase.co/storage/v1/object/public/images/b0533210c53b57848b7f21eb8c11a9e2.jpg');
            
            --primary: #ffb7c5; 
            --bg-color: #fff5f7; 
            --text: #5a4a4d; 
            --accent: #ff85a2; 
        }

        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6; 
            color: var(--text); 

            /* 背景图设置 */
            background-image: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), var(--bg-url);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .container { max-width: 600px; margin: 0 auto; }

        /* 卡片加入毛玻璃效果，更高级 */
        .card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0 8px 32px rgba(255, 183, 197, 0.3); 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
        }

        h1 { text-align: center; color: var(--accent); font-size: 1.5rem; text-shadow: 1px 1px 2px white; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 10px; box-sizing: border-box; outline: none; background: rgba(255,255,255,0.9); }
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 133, 162, 0.4); }
        button:hover { background: #ff5e84; transform: translateY(-2px); }
        
        .item-card { border-left: 5px solid var(--primary); display: flex; gap: 15px; align-items: center; }
        .item-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid #eee; background: white; }
        .item-info { flex: 1; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.75rem; background: #fff; border: 1px solid var(--primary); margin-top: 5px; }
        .expiry-red { color: #ff0000; font-weight: bold; border: 1px solid #ff0000; padding: 2px 5px; border-radius: 4px; font-size: 0.8rem; background: white; }
        
        .summary-card { background: var(--accent); color: #fff; text-align: center; }
        .error { color: #ff5e84; text-align: center; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px 0 white; }
        #loading { text-align: center; display: none; color: var(--accent); font-weight: bold; background: white; border-radius: 20px; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎀 谷子排单查询</h1>
            <div class="input-group">
                <label>查询密钥 (Query Key)</label>
                <input type="text" id="queryKey" placeholder="请输入团长提供的密钥" value="4goods">
            </div>
            <div class="input-group">
                <label>团员昵称 (CN)</label>
                <input type="text" id="cnName" placeholder="请输入你的排单CN">
            </div>
            <button onclick="doQuery()">立即查询</button>
            <div id="loading">✨ 正在召唤账单...</div>
            <div id="errorMsg" class="error"></div>
        </div>
        <div id="resultArea"></div>
    </div>

    <!-- 图片放大 -->
    <div id="imgModal" onclick="this.style.display='none'" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <img id="modalImg" style="max-width:95%; max-height:95%; border-radius:10px;">
    </div>

    <script>
        const SUPABASE_URL = 'https://oknhlfhdqbsukskdxqre.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function doQuery() {
            const key = document.getElementById('queryKey').value.trim();
            const cn = document.getElementById('cnName').value.trim();
            const resArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');

            if (!key || !cn) { errorArea.innerText = "❌ 请填写密钥和CN"; return; }
            errorArea.innerText = ""; resArea.innerHTML = ""; loading.style.display = "block";

            try {
                const { data, error } = await supabaseClient.rpc('get_group_by_key', { p_query_key: key });
                if (error) throw error;
                const myGoods = (data || []).filter(item => item.cn === cn);
                if (myGoods.length === 0) { errorArea.innerText = "❌ 未找到记录，请检查密钥或CN"; return; }

                const totalMoney = myGoods.reduce((sum, i) => sum + (parseFloat(i.price) * parseInt(i.quantity) || 0), 0);
                let html = `<div class="card summary-card"><div style="font-size: 1.4rem; font-weight: bold;">应肾总计：￥${totalMoney.toFixed(2)}</div></div>`;
                
                const today = new Date().toISOString().split('T')[0];
                myGoods.forEach(item => {
                    let expiryHtml = "";
                    if (item.status === "可排发" && item.storage_expiry) {
                        const isExpired = today > item.storage_expiry;
                        expiryHtml = `<div class="${isExpired ? 'expiry-red' : ''}" style="font-size: 0.75rem; margin-top:5px;">📦 囤货截止：${item.storage_expiry} ${isExpired ? '[已到期]' : ''}</div>`;
                    }
                    html += `<div class="card item-card"><img src="${item.image_url || 'https://via.placeholder.com/100?text=No+Pic'}" class="item-img" onclick="showImg('${item.image_url}')"><div class="item-info"><div style="font-weight:bold;">${item.name} (${item.country || '国内'})</div><div style="color:var(--accent); font-weight:bold;">￥${item.price} × ${item.quantity} = ￥${(item.price * item.quantity).toFixed(2)}</div><div class="status-tag">${item.status}</div>${expiryHtml}</div></div>`;
                });
                resArea.innerHTML = html;
            } catch (e) { errorArea.innerText = "⚠️ 查询出错：" + e.message; }
            finally { loading.style.display = "none"; }
        }
        function showImg(url) { if(!url) return; document.getElementById('modalImg').src = url; document.getElementById('imgModal').style.display = 'flex'; }
    </script>
</body>
</html>
