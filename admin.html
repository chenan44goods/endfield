<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团长后台系统 🛠️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f2f5; --pink: #ffb7c5; --accent: #ff85a2; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: #333; }
        
        nav { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .tabs { background: #fff; display: flex; padding: 0 20px; border-bottom: 1px solid #ddd; gap: 20px; }
        .tab-btn { padding: 12px 5px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; }
        .tab-btn.active { color: var(--main); border-bottom-color: var(--main); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }

        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        
        .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 10px; text-align: left; }
        .batch-bar { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; flex-wrap: wrap; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }

        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; font-size: 14px; }
        .btn { padding: 10px 16px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; white-space: nowrap; font-size: 14px; }
        .btn-primary { background: var(--main); color: #fff; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-outline { background: #fff; border: 1px solid #ddd; color: #666; }
        
        .img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .stats-badge { padding: 3px 10px; border-radius: 20px; background: #eee; font-size: 11px; margin-right: 5px; display: inline-block; }
        .hidden { display: none !important; }
        .selected-row { background-color: #f6f5ff !important; }
        .log-item { border-left: 3px solid var(--main); padding: 10px; margin-bottom: 10px; background: #f9f9f9; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <div id="debug-bar" style="background:#333; color:#fff; font-size:12px; text-align:center; padding:8px;">⌛ 正在加载系统...</div>

    <!-- 登录页 (默认隐藏，由 JS 决定是否显示) -->
    <div id="loginSection" class="hidden">
        <div class="card" style="max-width:350px; margin: 60px auto;">
            <h2 style="text-align:center">🎀 团长登录</h2>
            <input type="email" id="email" placeholder="管理邮箱">
            <input type="password" id="pw" placeholder="管理密码">
            <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="login()">立即登录</button>
            <p id="loginMsg" style="color:red; font-size:12px; text-align:center; margin-top:5px;"></p>
        </div>
    </div>

    <!-- 后台内容 -->
    <div id="adminSection" class="hidden">
        <nav>
            <strong id="roleTag">后台</strong>
            <div>
                <span id="userEmail" style="margin-right:10px; font-size:12px; color:#666"></span>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size:12px;" onclick="logout()">退出</button>
            </div>
        </nav>

        <div class="tabs">
            <div class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">📋 排表管理</div>
            <div class="tab-btn" data-tab="logs" onclick="switchTab('logs')">🔄 转单记录</div>
            <div class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ 团务设置</div>
        </div>

        <div class="main-content">
            <!-- 标签页1: 排表管理 -->
            <div id="tab-overview" class="tab-content">
                <div class="card">
                    <h3>📊 全团统计</h3>
                    <div id="statsArea"></div>
                </div>

                <div class="grid">
                    <div class="card">
                        <h3>✍️ 录入/编辑</h3>
                        <input type="hidden" id="editItemId">
                        <input type="text" id="itemName" placeholder="谷子名称">
                        <select id="itemCountry"><option>日本</option><option>国内</option><option>台湾</option></select>
                        <input type="text" id="itemCN" placeholder="团员CN">
                        <div style="display:flex; gap:5px">
                            <input type="number" id="itemPrice" placeholder="单价" step="0.01">
                            <input type="number" id="itemQty" value="1" placeholder="数量">
                        </div>
                        <select id="itemStatus">
                            <option>未出荷</option><option>已下单未到货</option><option>回国中</option><option>已到货</option><option>可排发</option><option>已排发</option><option>未付款</option>
                        </select>
                        <button class="btn btn-pink" style="width:100%; margin-top:10px" onclick="saveItem()">保存</button>
                        <button class="btn btn-outline" style="width:100%; margin-top:5px" onclick="clearForm()">重置</button>
                    </div>

                    <div class="card">
                        <h3>📥 批量导入</h3>
                        <textarea id="csvInput" rows="5" placeholder="粘贴 Excel 汇总表内容..."></textarea>
                        <button class="btn btn-primary" style="width:100%" onclick="previewImport()">导入数据</button>
                    </div>
                </div>

                <div class="table-wrap card">
                    <div class="batch-bar">
                        <input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll(this.checked)" style="width:auto">
                        <span style="font-size:12px">已选择 <strong id="selCount">0</strong> 条</span>
                        <button class="btn btn-primary" style="padding:4px 10px; font-size:12px;" onclick="openTransferModal('batch')">批量转单</button>
                        <button class="btn btn-danger" style="padding:4px 10px; font-size:12px;" onclick="batchDelete()">批量删除</button>
                    </div>
                    <table>
                        <thead><tr><th></th><th>图</th><th>名称</th><th>CN</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 标签页2: 转单记录 -->
            <div id="tab-logs" class="tab-content hidden">
                <div class="card">
                    <h3>📜 历史转单日志</h3>
                    <div id="transferLogsList"></div>
                </div>
            </div>

            <!-- 标签页3: 设置 -->
            <div id="tab-settings" class="tab-content hidden">
                <div class="card">
                    <h3>⚙️ 团务设置</h3>
                    <p>查询密钥：<strong id="dispKey"></strong></p>
                    <div id="coAdminList"></div>
                    <input type="email" id="newAdminEmail" placeholder="副团长邮箱">
                    <button class="btn btn-primary" onclick="addAdmin()">添加副团长</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 转单弹窗 -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal">
            <h3>🔄 订单转单交接</h3>
            <p id="transferInfo" style="font-size:12px; color:#666"></p>
            <input type="text" id="newCNInput" placeholder="输入新接手人 CN">
            <input type="text" id="transferNote" placeholder="转单备注（可选）">
            <div style="margin-top:15px; display:flex; gap:10px">
                <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" style="flex:1" onclick="executeTransfer()">确认转单</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oknhlfhdqbsukskdxqre.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentData = null;
        let currentUser = null;
        let selectedIds = new Set();
        let transferTargets = [];

        // 页面启动时加入安全超时机制（防止卡死）
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const debugBar = document.getElementById('debug-bar');
                if (debugBar && debugBar.innerText.includes("正在加载")) {
                    debugBar.innerText = "⚠️ 连接超时，已强制解除锁定。请直接尝试登录。";
                    debugBar.style.background = "#d9534f";
                    document.getElementById('loginSection').classList.remove('hidden');
                }
            }, 3000); // 3秒没响应自动切到登录页
            
            checkAuth();
        });

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pw').value.trim();
            const msgBox = document.getElementById('loginMsg');
            msgBox.innerText = "登录中...";
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                msgBox.innerText = "登录失败: " + error.message;
            } else {
                msgBox.innerText = "";
                checkAuth();
            }
        }

        async function logout() { 
            await supabaseClient.auth.signOut(); 
            location.reload(); 
        }

        async function checkAuth() {
            try {
                const { data: { user }, error: authErr } = await supabaseClient.auth.getUser();
                
                if (authErr || !user) {
                    // 未登录，显示登录框，隐藏后台
                    document.getElementById('loginSection').classList.remove('hidden');
                    document.getElementById('adminSection').classList.add('hidden');
                    document.getElementById('debug-bar').style.display = 'none'; // 隐藏顶栏
                    return;
                }

                currentUser = user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('debug-bar').innerText = "✅ 正在获取数据...";

                const { data: records, error: dbErr } = await supabaseClient.from('leader_data').select('*');
                
                if (dbErr) {
                    document.getElementById('debug-bar').innerText = "❌ 数据库读取错误: " + dbErr.message;
                    document.getElementById('debug-bar').style.background = "red";
                    return;
                }

                if (records && records.length > 0) {
                    currentData = records[0];
                    document.getElementById('debug-bar').style.display = 'none'; // 成功后隐藏黑条
                    renderUI();
                } else {
                    document.getElementById('debug-bar').innerText = "⚠️ 提示：数据库中暂无数据，请先初始化";
                    document.getElementById('debug-bar').style.background = "orange";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('debug-bar').innerText = "❌ 系统异常: " + err.message;
                document.getElementById('debug-bar').style.background = "red";
                // 异常时强行展示登录框防止死锁
                document.getElementById('loginSection').classList.remove('hidden');
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                if(b.getAttribute('data-tab') === tabId) b.classList.add('active');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            if (tabId === 'logs') renderLogs();
        }

        function renderUI() {
            try {
                if(!currentData) return;
                document.getElementById('dispKey').innerText = currentData.query_key || '未设置';
                const list = currentData.group_data || [];
                const total = list.reduce((s, i) => s + (i.price * i.quantity), 0);
                document.getElementById('statsArea').innerHTML = `<span class="stats-badge">项数: ${list.length}</span><span class="stats-badge">金额: ￥${total.toFixed(2)}</span>`;

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = list.slice().reverse().map(item => {
                    const isChecked = selectedIds.has(item.item_id);
                    return `<tr class="${isChecked ? 'selected-row' : ''}">
                        <td><input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelect('${item.item_id}')" style="width:auto"></td>
                        <td><img src="${item.image_url ? item.image_url+'?width=80' : ''}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td>${item.name}</td><td>${item.cn}</td><td>￥${item.price}x${item.quantity}</td>
                        <td><span class="stats-badge">${item.status}</span></td>
                        <td>
                            <button class="btn btn-outline" style="padding:2px 8px; font-size:11px" onclick="openTransferModal(['${item.item_id}'])">转单</button>
                            <button class="btn btn-outline" style="padding:2px 8px; font-size:11px" onclick="editItem('${item.item_id}')">改</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch(e) { console.error("渲染出错:", e); }
        }

        function toggleSelect(id) {
            if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
            document.getElementById('selCount').innerText = selectedIds.size;
            renderUI();
        }

        function toggleSelectAll(checked) {
            const list = (currentData && currentData.group_data) || [];
            if(checked) list.forEach(i => selectedIds.add(i.item_id)); else selectedIds.clear();
            document.getElementById('selCount').innerText = selectedIds.size;
            renderUI();
        }

        function openTransferModal(ids) {
            transferTargets = (ids === 'batch') ? Array.from(selectedIds) : ids;
            if(transferTargets.length === 0) return alert("请先勾选");
            document.getElementById('transferInfo').innerText = `已选 ${transferTargets.length} 项记录进行转交。`;
            document.getElementById('transferModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('transferModal').style.display = 'none'; }

        async function executeTransfer() {
            const newCN = document.getElementById('newCNInput').value.trim();
            const note = document.getElementById('transferNote').value.trim();
            if(!newCN) return alert("请输入新CN");
            
            let groupData = [...currentData.group_data];
            let newLogs = [];
            const now = new Date().toISOString();

            transferTargets.forEach(id => {
                const idx = groupData.findIndex(i => i.item_id === id);
                if(idx > -1) {
                    const oldCN = groupData[idx].cn;
                    groupData[idx].cn = newCN;
                    newLogs.push({ item_name: groupData[idx].name, from_cn: oldCN, to_cn: newCN, time: now, note, operator: currentUser.email });
                }
            });

            let imageData = currentData.image_data || {};
            if(!imageData.transfer_logs) imageData.transfer_logs = [];
            imageData.transfer_logs = [...newLogs, ...imageData.transfer_logs].slice(0, 500);

            const { error } = await supabaseClient.from('leader_data').update({ group_data: groupData, image_data: imageData }).eq('query_key', currentData.query_key);
            if(error) alert(error.message); else { alert("成功"); location.reload(); }
        }

        function renderLogs() {
            const logs = (currentData && currentData.image_data && currentData.image_data.transfer_logs) || [];
            document.getElementById('transferLogsList').innerHTML = logs.length === 0 ? "暂无转单记录" : logs.map(log => `
                <div class="log-item">
                    <strong>${log.item_name}</strong>: ${log.from_cn} ➔ ${log.to_cn}<br>
                    <small>${new Date(log.time).toLocaleString()} | 备注: ${log.note || '无'}</small>
                </div>
            `).join('');
        }

        async function saveItem() {
            const newItem = {
                item_id: document.getElementById('editItemId').value || Date.now().toString(),
                name: document.getElementById('itemName').value,
                country: document.getElementById('itemCountry').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQty').value) || 1,
                cn: document.getElementById('itemCN').value,
                status: document.getElementById('itemStatus').value,
                created_at: new Date().toISOString()
            };
            let newList = [...(currentData.group_data || [])];
            const idx = newList.findIndex(i => i.item_id === newItem.item_id);
            if(idx > -1) newList[idx] = newItem; else newList.push(newItem);
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        function editItem(id) {
            const item = currentData.group_data.find(i => i.item_id === id);
            document.getElementById('editItemId').value = item.item_id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCN').value = item.cn;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemQty').value = item.quantity;
            document.getElementById('itemStatus').value = item.status;
            switchTab('overview');
            window.scrollTo(0,0);
        }

        async function batchDelete() {
            if(selectedIds.size === 0) return;
            if(!confirm("确定？")) return;
            const newList = currentData.group_data.filter(i => !selectedIds.has(i.item_id));
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        async function previewImport() {
            const raw = document.getElementById('csvInput').value.trim();
            if(!raw) return alert("请先粘贴内容");
            const lines = raw.split('\n').filter(l => l.trim());
            const itemNames = lines[2].split('\t').slice(2);
            const prices = lines[3].split('\t').slice(2).map(p => parseFloat(p.replace(/[¥,]/g, '')) || 0);
            let items = [];
            for(let i = 5; i < lines.length; i++){
                const cells = lines[i].split('\t');
                const cn = cells[1]?.trim();
                if(!cn) continue;
                itemNames.forEach((name, idx) => {
                    const qty = parseInt(parseFloat(cells[idx+2]));
                    if(qty > 0) items.push({ item_id: Date.now()+'_'+Math.random().toString(36).substr(2,4), name: name.trim(), country:"日本", price: prices[idx], quantity: qty, cn, status: "未出荷", created_at: new Date().toISOString() });
                });
            }
            const newList = [...(currentData.group_data || []), ...items];
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        function clearForm() { 
            document.getElementById('editItemId').value = ""; 
            document.getElementById('itemName').value = "";
            document.getElementById('itemCN').value = "";
        }

        async function addAdmin() {
            const email = document.getElementById('newAdminEmail').value;
            const { data } = await supabaseClient.rpc('add_co_admin', { p_query_key: currentData.query_key, p_email: email });
            alert(data); location.reload();
        }
    </script>
</body>
</html>
