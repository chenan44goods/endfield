<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷子排单自查系统 🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-url: url('https://oknhlfhdqbsukskdxqre.supabase.co/storage/v1/object/public/images/b0533210c53b57848b7f21eb8c11a9e2.jpg');
            --primary: #ffb7c5; --accent: #ff85a2; --text: #5a4a4d; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; color: var(--text); 
            background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), var(--bg-url);
            background-size: cover; background-position: center;
            /* 手机端默认不固定背景，解决卡顿 */
            background-attachment: scroll; 
        }
        @media (min-width: 768px) { body { background-attachment: fixed; } }

        .container { max-width: 600px; margin: 0 auto; }
        .card { 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            border-radius: 12px; padding: 18px; box-shadow: 0 4px 15px rgba(255, 183, 197, 0.2); 
            margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.4); 
        }
        h1 { text-align: center; color: var(--accent); margin: 0 0 15px 0; font-size: 1.4rem; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        input { width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        .item-card { border-left: 5px solid var(--primary); display: flex; gap: 12px; align-items: center; }
        .item-img { width: 75px; height: 75px; border-radius: 8px; object-fit: cover; background: #eee; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: bold; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.7rem; background: #fff; border: 1px solid var(--primary); margin-top: 5px; }
        .summary-card { background: var(--accent); color: #fff; text-align: center; font-weight: bold; }
        #loading { text-align: center; display: none; color: var(--accent); margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎀 谷子排单查询</h1>
            <label>查询密钥</label>
            <input type="text" id="queryKey" value="4goods">
            <label>团员昵称 (CN)</label>
            <input type="text" id="cnName" placeholder="输入你的CN">
            <button onclick="doQuery()">立即查询</button>
            <div id="loading">✨ 魔法检索中...</div>
            <div id="errorMsg" style="color:red; text-align:center; margin-top:10px; font-size:14px;"></div>
        </div>
        <div id="resultArea"></div>
    </div>
    <div id="imgModal" onclick="this.style.display='none'" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;"><img id="modalImg" style="max-width:95%; max-height:95%; border-radius:10px;"></div>

    <script>
        const supabaseClient = supabase.createClient('https://oknhlfhdqbsukskdxqre.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y');
        async function doQuery() {
            const key = document.getElementById('queryKey').value.trim();
            const cn = document.getElementById('cnName').value.trim();
            const resArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            if (!key || !cn) return;
            resArea.innerHTML = ""; loading.style.display = "block";
            try {
                const { data } = await supabaseClient.rpc('get_group_by_key', { p_query_key: key });
                const myGoods = (data || []).filter(item => item.cn === cn);
                if (myGoods.length === 0) { document.getElementById('errorMsg').innerText = "未找到记录"; return; }
                const total = myGoods.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                let html = `<div class="card summary-card">应肾总计：￥${total.toFixed(2)}</div>`;
                myGoods.forEach(item => {
                    // 优化：使用缩略图渲染列表
                    const thumb = item.image_url ? `${item.image_url}?width=200` : 'https://via.placeholder.com/100';
                    html += `<div class="card item-card"><img src="${thumb}" class="item-img" onclick="showImg('${item.image_url}')"><div class="item-info"><div class="item-name">${item.name}</div><div style="color:var(--accent);font-weight:bold;">￥${item.price} × ${item.quantity}</div><div class="status-tag">${item.status}</div></div></div>`;
                });
                resArea.innerHTML = html;
            } catch (e) { alert("查询失败"); } finally { loading.style.display = "none"; }
        }
        function showImg(url) { if(!url) return; document.getElementById('modalImg').src = url; document.getElementById('imgModal').style.display = 'flex'; }
    </script>
</body>
</html>
