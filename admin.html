<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团长后台系统 🛠️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f2f5; --pink: #ffb7c5; --accent: #ff85a2; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: #333; }
        
        /* 导航与标签 */
        nav { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .tabs { background: #fff; display: flex; padding: 0 20px; border-bottom: 1px solid #ddd; gap: 20px; }
        .tab-btn { padding: 12px 5px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; }
        .tab-btn.active { color: var(--main); border-bottom-color: var(--main); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* 卡片与组件 */
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        
        /* 搜索筛选栏 */
        .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; background: #fdfdfd; padding: 12px; border-radius: 10px; border: 1px solid #eee; }
        .search-input-group { display: flex; align-items: center; background: #fff; border: 2px solid var(--main); border-radius: 8px; padding: 2px 12px; flex: 1; min-width: 200px; }
        .search-input-group input { border: none; outline: none; padding: 8px; flex: 1; font-size: 14px; }
        
        .batch-bar { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; flex-wrap: wrap; }
        .filter-info { font-size: 12px; color: var(--main); margin-bottom: 10px; font-weight: bold; display: none; }
        .stats-badge { padding: 4px 12px; border-radius: 20px; background: #eee; font-size: 12px; margin-right: 8px; display: inline-block; font-weight: bold; }

        /* 按钮与弹窗 */
        .btn { padding: 8px 16px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; white-space: nowrap; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: var(--main); color: #fff; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-outline { background: #fff; border: 1px solid #ddd; color: #666; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
        .hidden { display: none !important; }

        /* 选中行高亮 */
        .selected-row { background: #fff0f5 !important; }
        tr { transition: background 0.15s; }
        tbody tr:hover { background: #fafafa; }

        /* 单条图片预览 */
        .item-preview-img { max-height: 100px; border-radius: 8px; border: 1px solid #eee; margin-top: 8px; display: none; }

        /* 日志样式 */
        .log-item { font-size: 12px; border-left: 3px solid var(--main); padding: 10px; margin-bottom: 10px; background: #f9f9f9; border-radius: 0 8px 8px 0; }
        .log-time { color: #999; font-size: 11px; }
    </style>
</head>
<body>

    <!-- 状态栏 -->
    <div id="debug-bar" style="background:#333; color:#fff; font-size:12px; text-align:center; padding:8px;">⌛ 正在同步环境...</div>

    <!-- 登录模块 -->
    <div id="loginSection">
        <div class="card" style="max-width:350px; margin: 80px auto; padding: 30px;">
            <h2 style="text-align:center; margin-top:0;">🎀 团长登录</h2>
            <input type="email" id="email" placeholder="管理邮箱" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
            <input type="password" id="pw" placeholder="密码" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
            <button class="btn btn-primary" style="width:100%;" onclick="login()">立即进入后台</button>
            <p id="loginMsg" style="color:red; font-size:12px; text-align:center; margin-top:10px;"></p>
        </div>
    </div>

    <!-- 后台管理主体 -->
    <div id="adminSection" class="hidden">
        <nav>
            <strong id="roleTag">后台载入中</strong>
            <div style="display:flex; align-items:center;">
                <span id="userEmail" style="margin-right:10px; font-size:12px; color:#666"></span>
                <button class="btn btn-outline" style="padding:4px 10px; font-size:11px;" onclick="logout()">退出</button>
            </div>
        </nav>

        <div class="tabs">
            <div class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">📋 排表管理</div>
            <div class="tab-btn" data-tab="logs" onclick="switchTab('logs')">🔄 转单记录</div>
            <div class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ 团务设置</div>
        </div>

        <div class="main-content">
            <!-- 排表管理页 -->
            <div id="tab-overview" class="tab-content">
                <div class="card"><div id="statsArea"></div></div>

                <div class="grid">
                    <!-- 单条录入 -->
                    <div class="card">
                        <h3>✍️ 录入/编辑记录</h3>
                        <input type="hidden" id="editItemId">
                        <input type="text" id="itemName" placeholder="谷子名称" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:6px;">
                        <select id="itemCountry" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:6px;">
                            <option value="国内">国内</option>
                            <option value="台湾">台湾</option>
                            <option value="泰国">泰国</option>
                            <option value="印尼">印尼</option>
                            <option value="美国">美国</option>
                            <option value="日本" selected>日本</option>
                            <option value="韩国">韩国</option>
                        </select>
                        <input type="text" id="itemCN" placeholder="团员CN" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:6px;">
                        <div style="display:flex; gap:5px; margin-bottom:8px;">
                            <input type="number" id="itemPrice" placeholder="单价" step="0.01" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:6px;">
                            <input type="number" id="itemQty" value="1" min="1" style="width:80px; padding:8px; border:1px solid #ddd; border-radius:6px;">
                        </div>
                        <select id="itemStatus" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:6px;">
                            <option value="未出荷">未出荷</option>
                            <option value="已下单未到货">已下单未到货</option>
                            <option value="回国中">回国中</option>
                            <option value="已到货">已到货</option>
                            <option value="可排发">可排发</option>
                            <option value="已排发">已排发</option>
                            <option value="未付款">未付款</option>
                        </select>
                        <label style="font-size:12px; color:#666; display:block; margin-bottom:4px;">柄图（可选）：</label>
                        <input type="file" id="itemFile" accept="image/*" style="font-size:12px;" onchange="previewItemFile()">
                        <img id="itemPreview" class="item-preview-img">
                        <button class="btn btn-pink" style="width:100%; margin-top:10px" id="saveItemBtn" onclick="saveItem()">💾 保存记录</button>
                        <button class="btn btn-outline" style="width:100%; margin-top:5px" onclick="clearForm()">🗑️ 重置清空</button>
                    </div>

                    <!-- 批量导入 -->
                    <div class="card">
                        <h3>📥 批量导入 (Excel)</h3>
                        <textarea id="csvInput" rows="6" placeholder="直接粘贴 Excel 汇总表内容..." style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; font-family:monospace; font-size:12px;"></textarea>
                        <button class="btn btn-primary" style="width:100%; margin-top:8px;" id="importBtn" onclick="previewImport()">解析并导入</button>
                    </div>
                </div>

                <!-- 排表表格 -->
                <div class="card" style="overflow-x:auto;">
                    <h3>📜 全团排单明细</h3>
                    
                    <div class="search-row">
                        <div class="search-input-group">
                            <input type="text" id="universalSearchInput" placeholder="搜 CN 或 谷子名称..." onkeypress="if(event.keyCode==13) applySearchFilter()">
                        </div>
                        <button class="btn btn-primary" onclick="applySearchFilter()">搜索</button>
                        <button class="btn btn-outline" onclick="clearSearchFilter()">清除</button>
                        <button class="btn btn-pink" onclick="openBatchImgModal()">🖼️ 批量补图</button>
                    </div>

                    <div id="filterStatusText" class="filter-info"></div>

                    <div class="batch-bar">
                        <input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll(this.checked)" style="width:auto; margin-right:5px;">
                        <span style="font-size:12px">已选 <strong id="selCount">0</strong> 条</span>
                        <button class="btn btn-primary" style="padding:4px 10px; font-size:11px;" onclick="openTransferModal('batch')">批量转单</button>
                        <button class="btn btn-danger" style="padding:4px 10px; font-size:11px;" onclick="batchDelete()">批量删除</button>
                    </div>

                    <table style="width:100%; border-collapse:collapse; font-size:13px;">
                        <thead>
                            <tr style="background:#f5f5f5;">
                                <th style="width:30px; padding:8px;"></th>
                                <th style="padding:8px;">图</th>
                                <th style="padding:8px;">名称</th>
                                <th style="padding:8px;">CN</th>
                                <th style="padding:8px;">金额</th>
                                <th style="padding:8px;">状态</th>
                                <th style="padding:8px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 转单记录页 -->
            <div id="tab-logs" class="tab-content hidden">
                <div class="card">
                    <h3>🔄 转单历史日志</h3>
                    <div id="transferLogsList"></div>
                </div>
            </div>

            <!-- 团务设置页 -->
            <div id="tab-settings" class="tab-content hidden">
                <div class="card">
                    <h3>⚙️ 团务设置</h3>
                    <p>查询密钥：<strong id="dispKey">-</strong></p>
                    <div id="coAdminList" style="margin:10px 0;"></div>
                    <div id="ownerOnlyArea" style="display:none;">
                        <input type="email" id="newAdminEmail" placeholder="添加副团员邮箱" style="padding:8px; border:1px solid #ddd; border-radius:6px; width:200px;">
                        <button class="btn btn-primary" onclick="addAdmin()">添加</button>
                        <p style="font-size:12px; color:#999; margin-top:5px;">副团长上限 3 人，只能由团长添加</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量补图弹窗 -->
    <div class="modal-overlay" id="batchImgModal">
        <div class="modal">
            <h3>🖼️ 批量补图</h3>
            <p id="batchImgInfo" style="font-size:13px; color:var(--main); margin-bottom:15px;"></p>
            <input type="file" id="batchImgFile" accept="image/*" style="margin-bottom:10px;">
            <img id="batchImgPreview" style="max-height:120px; border-radius:8px; display:none; margin-bottom:10px;">
            <div style="margin-top:20px; display:flex; gap:10px">
                <button class="btn btn-outline" style="flex:1" onclick="closeBatchImgModal()">取消</button>
                <button class="btn btn-primary" id="confirmBatchImgBtn" style="flex:1" onclick="executeBatchImgUpdate()">✅ 确认补图</button>
            </div>
        </div>
    </div>

    <!-- 转单弹窗 -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal">
            <h3>🔄 订单转交</h3>
            <p id="transferInfo" style="font-size:13px; color:#666; margin-bottom:15px;"></p>
            <input type="text" id="newCNInput" placeholder="输入新接手人 CN" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px;">
            <input type="text" id="transferNote" placeholder="转单备注（可选）" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px;">
            <div style="display:flex; gap:10px">
                <button class="btn btn-outline" style="flex:1" onclick="closeTransferModal()">取消</button>
                <button class="btn btn-primary" style="flex:1" onclick="executeTransfer()">确认转单</button>
            </div>
        </div>
    </div>

        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const pw = document.getElementById('pw').value.trim();

            if (error) {
                document.getElementById('loginMsg').innerText = error.message;
