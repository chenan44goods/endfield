<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团长后台系统 🛠️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f2f5; --pink: #ffb7c5; }
        body { font-family: system-ui; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #debug-bar { background: #333; color: #fff; padding: 5px 10px; font-size: 12px; text-align: center; z-index: 9999; }
        .login-box { max-width: 400px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        nav { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; font-size: 13px; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin: 5px 0; width: 100%; box-sizing: border-box; font-family: inherit; }
        .btn { padding: 10px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; margin-right: 5px; }
        .btn-primary { background: var(--main); color: #fff; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-danger { background: #ff7675; color: #fff; }
        .stats-badge { padding: 3px 8px; border-radius: 12px; background: #f0f0f0; font-size: 11px; margin-right: 5px; border: 1px solid #ddd; }
        #initGuide { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .img-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
        .import-preview-area { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px dashed #ccc; margin-top: 10px; font-size: 12px; max-height: 150px; overflow-y: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-bar">⏳ 正在同步系统状态...</div>

    <!-- 登录模块 -->
    <div id="loginSection" class="login-box">
        <h2 style="text-align:center">🎀 团长登录</h2>
        <input type="email" id="email" placeholder="管理邮箱">
        <input type="password" id="pw" placeholder="管理密码">
        <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="login()">登录后台</button>
        <p id="loginStatus" style="font-size:12px; color:red; text-align:center; margin-top:10px"></p>
    </div>

    <!-- 初始化引导 -->
    <div id="initGuide" class="hidden">
        <div class="card" style="color:#333; width: 320px; text-align: center;">
            <h3>✨ 欢迎新团长</h3>
            <p style="font-size: 14px; color: #666;">请设置你的查询密钥<br>(团员查询时需要输入此项)</p>
            <input type="text" id="newQueryKey" placeholder="例如：endfield">
            <button class="btn btn-primary" style="width: 100%;" onclick="initSystem()">完成初始化</button>
        </div>
    </div>

    <!-- 管理后台主体 -->
    <div id="adminSection" class="hidden">
        <nav>
            <strong id="roleTag">载入中...</strong>
            <div>
                <span id="userEmail" style="margin-right:15px; font-size:13px; color:#666"></span>
                <button class="btn btn-danger" style="padding: 5px 10px;" onclick="logout()">退出</button>
            </div>
        </nav>

        <div class="main-content">
            <div class="card" style="margin-bottom:20px;">
                <h3>📊 数据统计</h3>
                <div id="statsArea"></div>
            </div>

            <div class="grid">
                <!-- 排谷录入 -->
                <div class="card">
                    <h3>✍️ 编辑/新增排单</h3>
                    <input type="hidden" id="editItemId">
                    <label>谷子名称</label><input type="text" id="itemName">
                    <label>地区</label>
                    <select id="itemCountry">
                        <option>国内</option><option>日本</option><option>台湾</option><option>泰国</option><option>印尼</option><option>美国</option><option>韩国</option>
                    </select>
                    <label>团员昵称 (CN)</label><input type="text" id="itemCN">
                    <div style="display:flex; gap:10px">
                        <div><label>单价</label><input type="number" id="itemPrice" step="0.01"></div>
                        <div><label>数量</label><input type="number" id="itemQty" value="1"></div>
                    </div>
                    <label>状态</label>
                    <select id="itemStatus" onchange="checkStatusChange(this.value)">
                        <option>未出荷</option><option>已下单未到货</option><option>回国中</option><option>已到货</option><option>可排发</option><option>已排发</option><option>未付款</option>
                    </select>
                    <div id="expiryInput" class="hidden">
                        <label style="color:red">📦 设置囤货截止日</label>
                        <input type="date" id="itemExpiry">
                    </div>
                    <label>柄图上传</label>
                    <input type="file" id="itemFile" accept="image/*">
                    <button class="btn btn-pink" style="width:100%; margin-top:15px" onclick="saveItem()">保存记录</button>
                    <button class="btn" style="width:100%; margin-top:5px" onclick="clearForm()">清空表单</button>
                </div>

                <!-- 批量导入 -->
                <div class="card">
                    <h3>📥 批量导入通贩排表</h3>
                    <label>通贩地区</label>
                    <select id="importCountry">
                        <option>日本</option><option>国内</option><option>台湾</option><option>泰国</option><option>印尼</option><option>美国</option><option>韩国</option>
                    </select>
                    <label>粘贴 CSV 数据（从 Excel 直接复制）</label>
                    <textarea id="csvInput" rows="8" placeholder="总金额	CN	谷子A	谷子B...&#10;,单价,10,20...&#10;100,昵称,,1..."></textarea>
                    
                    <div style="margin-top:10px">
                        <button class="btn btn-primary" onclick="previewImport()">🔍 预览数据</button>
                        <button class="btn btn-pink" id="confirmImportBtn" disabled onclick="executeImport()">✅ 确认导入</button>
                    </div>

                    <div id="importPreview" class="import-preview-area">尚未进行预览...</div>
                    <p id="importResult" style="font-size:12px; margin-top:5px; color:var(--main)"></p>
                </div>

                <!-- 团务设置 -->
                <div id="ownerSettings" class="card hidden">
                    <h3>⚙️ 团务设置</h3>
                    <p>查询密钥：<strong id="dispKey" style="color:var(--main); background:#eee; padding:2px 5px;"></strong></p>
                    <hr>
                    <h4>副团长列表</h4>
                    <div id="coAdminList" style="margin-bottom:15px;"></div>
                    <label>添加副团长(邮箱)</label>
                    <input type="email" id="newAdminEmail" placeholder="输入已注册的邮箱">
                    <button class="btn btn-primary" style="width:100%;" onclick="addAdmin()">添加</button>
                </div>
            </div>

            <div class="card" style="margin-top:20px; overflow-x:auto;">
                <h3>📜 排单明细</h3>
                <table id="goodsTable">
                    <thead><tr><th>图</th><th>谷名</th><th>CN</th><th>明细</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oknhlfhdqbsukskdxqre.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentData = null;
        let currentUser = null;
        let tempImportData = []; // 暂存解析后的数据

        // --- 基础权限逻辑 ---
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pw').value.trim();
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) document.getElementById('loginStatus').innerText = "错误: " + error.message;
            else checkAuth();
        }
        async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

        async function checkAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                document.getElementById('debug-bar').innerText = "💡 请先登录团长账号";
                document.getElementById('loginSection').classList.remove('hidden');
                return;
            }
            currentUser = user;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;

            const { data: records } = await supabaseClient.from('leader_data').select('*');
            if (records && records.length > 0) {
                currentData = records[0];
                document.getElementById('debug-bar').innerText = "✅ 数据同步成功";
                document.getElementById('debug-bar').style.background = "green";
                renderUI();
            } else {
                document.getElementById('initGuide').classList.remove('hidden');
            }
        }

        async function initSystem() {
            const key = document.getElementById('newQueryKey').value.trim();
            const { error } = await supabaseClient.rpc('init_leader_data', { p_query_key: key });
            if(error) alert(error.message); else location.reload();
        }

        // --- 批量导入逻辑 ---
        function previewImport() {
            const rawData = document.getElementById('csvInput').value.trim();
            const country = document.getElementById('importCountry').value;
            const previewArea = document.getElementById('importPreview');
            const resultMsg = document.getElementById('importResult');
            const confirmBtn = document.getElementById('confirmImportBtn');

            if (!rawData) { alert("请先粘贴 CSV 数据"); return; }

            // 1. 解析行和列 (兼容 Tab 和 逗号)
            const lines = rawData.split('\n').map(l => l.split(/[,\t]/).map(v => v.trim()));
            if (lines.length < 3) { alert("格式错误：至少需要表头、单价和一行团员数据"); return; }

            const headerRow = lines[0]; // 第1行：谷子名称
            const priceRow = lines[1];  // 第2行：单价
            const itemNames = headerRow.slice(2); // 从第3列起是名称
            const itemPrices = priceRow.slice(2).map(p => parseFloat(p.replace(/[¥,]/g, '')) || 0);

            if (itemNames.length === 0) { alert("格式错误：未在第1行找到谷子名称"); return; }

            tempImportData = [];
            let previewText = "";

            // 2. 遍历团员行 (从第3行起)
            for (let i = 2; i < lines.length; i++) {
                const row = lines[i];
                const cn = row[1]; // 第2列是 CN
                if (!cn) continue;

                // 3. 遍历每一列谷子
                for (let j = 0; j < itemNames.length; j++) {
                    const itemName = itemNames[j];
                    const price = itemPrices[j];
                    const qtyVal = row[j + 2]; // 数量从第3列开始对应
                    const qty = parseInt(qtyVal);

                    if (itemName && !isNaN(qty) && qty > 0) {
                        const newItem = {
                            item_id: Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                            name: itemName,
                            country: country,
                            price: price,
                            quantity: qty,
                            cn: cn,
                            status: "未出荷",
                            image_url: "",
                            storage_expiry: null,
                            created_at: new Date().toISOString()
                        };
                        tempImportData.push(newItem);
                        
                        if (tempImportData.length <= 5) {
                            previewText += `${tempImportData.length}. ${cn} - ${itemName} x${qty} (￥${price}) - ${country}\n`;
                        }
                    }
                }
            }

            if (tempImportData.length === 0) {
                previewArea.innerText = "❌ 未找到有效排谷记录，请检查格式";
                confirmBtn.disabled = true;
            } else {
                previewArea.innerText = `预览(前5条)：\n${previewText}${tempImportData.length > 5 ? '...' : ''}`;
                resultMsg.innerText = `解析成功：即将导入 ${tempImportData.length} 条记录`;
                confirmBtn.disabled = false;
            }
        }

        async function executeImport() {
            if (tempImportData.length === 0) return;
            const btn = document.getElementById('confirmImportBtn');
            btn.innerText = "🚀 正在导入...";
            btn.disabled = true;

            const newList = [...(currentData.group_data || []), ...tempImportData];

            const { error } = await supabaseClient.from('leader_data')
                .update({ group_data: newList })
                .eq('query_key', currentData.query_key);

            if (error) {
                alert("导入失败: " + error.message);
                btn.innerText = "✅ 确认导入";
                btn.disabled = false;
            } else {
                alert(`🎉 成功导入 ${tempImportData.length} 条排谷记录！`);
                location.reload();
            }
        }

        // --- 原有管理逻辑 ---
        function renderUI() {
            const isOwner = currentData.user_id === currentUser.id;
            if (isOwner) {
                document.getElementById('ownerSettings').classList.remove('hidden');
                document.getElementById('dispKey').innerText = currentData.query_key;
                renderAdmins();
            }
            document.getElementById('roleTag').innerText = isOwner ? "🎀 团长后台" : "助理后台";
            
            const list = currentData.group_data || [];
            const totalSum = list.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('statsArea').innerHTML = `<strong>总项: ${list.length}</strong> | <strong>应肾: ￥${totalSum.toFixed(2)}</strong>`;

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = list.slice().reverse().map((item) => `
                <tr>
                    <td><img src="${item.image_url || ''}" class="img-preview" onerror="this.src='https://via.placeholder.com/50?text=无图'"></td>
                    <td>${item.name}<br><small>${item.country}</small></td>
                    <td>${item.cn}</td>
                    <td>￥${item.price}x${item.quantity}</td>
                    <td><span class="stats-badge">${item.status}</span></td>
                    <td>
                        <button onclick="editItem('${item.item_id}')" style="font-size:11px">编辑</button>
                        <button onclick="deleteItem('${item.item_id}')" style="font-size:11px;color:red">删</button>
                    </td>
                </tr>
            `).join('');
        }

        async function saveItem() {
            const file = document.getElementById('itemFile').files[0];
            let imageUrl = document.getElementById('editItemId').dataset.img || "";
            if (file) {
                const fileName = `${Date.now()}_${file.name}`;
                const { error: uploadError } = await supabaseClient.storage.from('images').upload(fileName, file);
                if (uploadError) return alert("上传失败");
                imageUrl = `${SUPABASE_URL}/storage/v1/object/public/images/${fileName}`;
            }
            const newItem = {
                item_id: document.getElementById('editItemId').value || Date.now().toString(),
                name: document.getElementById('itemName').value || "未命名",
                country: document.getElementById('itemCountry').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQty').value) || 1,
                cn: document.getElementById('itemCN').value || "未知",
                status: document.getElementById('itemStatus').value,
                image_url: imageUrl,
                storage_expiry: document.getElementById('itemExpiry').value || null,
                created_at: new Date().toISOString()
            };
            let newList = [...(currentData.group_data || [])];
            const idx = newList.findIndex(i => i.item_id === newItem.item_id);
            if (idx > -1) newList[idx] = newItem; else newList.push(newItem);

            const { error } = await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            if (error) alert("保存失败: " + error.message); else location.reload();
        }

        function editItem(id) {
            const item = currentData.group_data.find(i => i.item_id === id);
            document.getElementById('editItemId').value = item.item_id;
            document.getElementById('editItemId').dataset.img = item.image_url;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCountry').value = item.country;
            document.getElementById('itemCN').value = item.cn;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemQty').value = item.quantity;
            document.getElementById('itemStatus').value = item.status;
            document.getElementById('itemExpiry').value = item.storage_expiry || "";
            checkStatusChange(item.status);
            window.scrollTo(0,0);
        }

        async function deleteItem(id) {
            if(!confirm("确定删除？")) return;
            const newList = currentData.group_data.filter(i => i.item_id !== id);
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        function checkStatusChange(val) {
            if(val === "可排发") document.getElementById('expiryInput').classList.remove('hidden');
            else document.getElementById('expiryInput').classList.add('hidden');
        }

        async function addAdmin() {
            const email = document.getElementById('newAdminEmail').value;
            const { data, error } = await supabaseClient.rpc('add_co_admin', { p_query_key: currentData.query_key, p_email: email });
            alert(data || error.message); location.reload();
        }

        function renderAdmins() {
            const list = currentData.admin_ids || [];
            document.getElementById('coAdminList').innerHTML = list.length ? list.map(id => `<div>助理UID: ${id.substring(0,8)}... <button onclick="removeAdmin('${id}')">移除</button></div>`).join('') : "暂无助理";
        }

        async function removeAdmin(uid) {
            await supabaseClient.rpc('remove_co_admin', { p_query_key: currentData.query_key, p_admin_id: uid });
            location.reload();
        }

        function clearForm() {
            document.getElementById('editItemId').value = "";
            document.getElementById('itemName').value = "";
            document.getElementById('itemCN').value = "";
            document.getElementById('itemFile').value = "";
        }

        checkAuth();
    </script>
</body>
</html>
