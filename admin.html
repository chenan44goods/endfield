<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团长后台系统 🛠️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f2f5; --pink: #ffb7c5; --accent: #ff85a2; --danger: #ff4d4f; --success: #28a745; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: #333; }
        #debug-bar { background: #333; color: #fff; font-size: 12px; text-align: center; padding: 8px; position: fixed; top: 0; width: 100%; z-index: 9999; }
        nav { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; margin-top: 30px; }
        .tabs { background: #fff; display: flex; padding: 0 20px; border-bottom: 1px solid #ddd; gap: 20px; position: sticky; top: 0; z-index: 100; overflow-x: auto; }
        .tab-btn { padding: 12px 10px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; white-space: nowrap; }
        .tab-btn.active { color: var(--main); border-bottom-color: var(--main); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 10px; text-align: left; vertical-align: top; }
        .btn { padding: 8px 16px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; white-space: nowrap; font-size: 13px; }
        .btn-primary { background: var(--main); color: #fff; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-outline { background: #fff; border: 1px solid #ddd; color: #666; }
        .btn-danger { background: var(--danger); color: #fff; }
        .stats-badge { padding: 4px 12px; border-radius: 20px; background: #eee; font-size: 12px; margin-right: 8px; display: inline-block; font-weight: bold; }
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal { background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
        .batch-bar { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="debug-bar">⌛ 正在同步全团数据...</div>

    <div id="loginSection" class="hidden">
        <div class="card" style="max-width:350px; margin: 80px auto; padding: 30px;">
            <h2 style="text-align:center">🎀 团长登录</h2>
            <input type="email" id="email" placeholder="邮箱" style="width:100%; margin-bottom:10px; padding:8px; border:1px solid #ddd; border-radius:5px;">
            <input type="password" id="pw" placeholder="密码" style="width:100%; margin-bottom:10px; padding:8px; border:1px solid #ddd; border-radius:5px;">
            <button class="btn btn-primary" style="width:100%" onclick="login()">进入后台</button>
        </div>
    </div>

    <div id="adminSection" class="hidden">
        <nav>
            <strong id="roleTag">团长后台</strong>
            <span id="userEmail" style="font-size:12px; color:#666"></span>
            <button class="btn btn-outline" onclick="logout()">退出</button>
        </nav>

        <div class="tabs">
            <div class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">📋 排表管理</div>
            <div class="tab-btn" data-tab="shipping" onclick="switchTab('shipping')">📦 排发工作台</div>
            <div class="tab-btn" data-tab="logs" onclick="switchTab('logs')">🔄 转单记录</div>
            <div class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ 团务设置</div>
        </div>

        <div class="main-content">
            <!-- 1. 排表管理 -->
            <div id="tab-overview" class="tab-content">
                <div class="card"><div id="statsArea"></div></div>
                <div class="grid">
                    <div class="card">
                        <h3>✍️ 录入/编辑</h3>
                        <input type="hidden" id="editItemId">
                        <input type="text" id="itemName" placeholder="谷子名称" style="width:100%; margin-bottom:5px; padding:5px;">
                        <input type="text" id="itemCN" placeholder="团员CN" style="width:100%; margin-bottom:5px; padding:5px;">
                        <div style="display:flex; gap:5px; margin-bottom:5px"><input type="number" id="itemPrice" placeholder="单价" style="flex:1; padding:5px;"><input type="number" id="itemQty" value="1" style="width:50px; padding:5px;"></div>
                        <select id="itemStatus" style="width:100%; padding:5px;">
                            <option>未出荷</option><option>已下单未到货</option><option>回国中</option><option>已到货</option><option>可排发</option><option>已申请发货</option><option>已排发</option><option>未付款</option>
                        </select>
                        <button class="btn btn-pink" style="width:100%; margin-top:10px" onclick="saveItem()">保存记录</button>
                    </div>
                    <div class="card">
                        <h3>📥 批量导入</h3>
                        <textarea id="csvInput" rows="5" placeholder="直接粘贴 Excel 内容..." style="width:100%; box-sizing:border-box; padding:5px; border-radius:5px; border:1px solid #ddd;"></textarea>
                        <button class="btn btn-primary" style="width:100%; margin-top:5px" onclick="previewImport()">识别并导入</button>
                    </div>
                </div>

                <div class="card table-wrap">
                    <div style="display:flex; gap:10px; margin-bottom:10px">
                        <input type="text" id="universalSearchInput" placeholder="搜 CN 或谷子..." style="flex:1; padding:5px; border:1px solid #ddd; border-radius:5px;" onkeypress="if(event.keyCode==13) applySearchFilter()">
                        <button class="btn btn-primary" onclick="applySearchFilter()">搜索</button>
                        <button class="btn btn-pink" onclick="openBatchImgModal()">🖼️ 补图</button>
                    </div>

                    <div id="batchBar" class="batch-bar hidden">
                        <span id="selectedTip">已选择 0 条记录</span>
                        <button class="btn btn-outline" onclick="openTransferModal(null)">🔄 批量转单</button>
                        <button class="btn btn-outline" onclick="openBatchStatusModal()">✏️ 批量改状态</button>
                        <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger)" onclick="batchDeleteItems()">🗑️ 批量删除</button>
                    </div>

                    <table>
                        <thead><tr><th><input type="checkbox" onclick="toggleSelectAll(this.checked)"></th><th>图</th><th>谷名</th><th>CN</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. 排发工作台 -->
            <div id="tab-shipping" class="tab-content hidden">
                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <div class="card" style="flex:1; margin-bottom:0; text-align:center;"><h4 style="margin:0;color:#666">📦 待处理申请</h4><h2 id="pendingShipCount">0</h2></div>
                    <div class="card" style="flex:1; margin-bottom:0; text-align:center;"><h4 style="margin:0;color:#666">✅ 累计已发货</h4><h2 id="completedShipCount">0</h2></div>
                </div>
                <div style="margin-bottom:15px;">
                    <button class="btn btn-primary" id="viewPendingBtn" onclick="toggleShipView('pending')">待处理申请</button>
                    <button class="btn btn-outline" id="viewDoneBtn" onclick="toggleShipView('done')">已完成记录</button>
                </div>
                <div class="table-wrap">
                    <table id="shippingTable">
                        <thead><tr><th>申请时间</th><th>团员CN</th><th>谷子明细</th><th>备注</th><th>操作</th></tr></thead>
                        <tbody id="shipBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-logs" class="tab-content hidden"><div class="card"><h3>🔄 转单日志</h3><div id="transferLogsList"></div></div></div>
            <div id="tab-settings" class="tab-content hidden"><div class="card"><h3>⚙️ 设置</h3><p>密钥：<strong id="dispKey">-</strong></p></div></div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal">
            <h3 id="transferTitle">🔄 谷子转单</h3>
            <input type="text" id="newCN" placeholder="新接手人的 CN" style="width:100%; margin-bottom:10px; padding:8px; border:1px solid #ddd; border-radius:5px;">
            <textarea id="transferNote" placeholder="备注" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:5px;"></textarea>
            <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="executeTransfer()">确认转单</button>
            <button class="btn btn-outline" style="width:100%; margin-top:5px" onclick="document.getElementById('transferModal').style.display='none'">取消</button>
        </div>
    </div>

    <div class="modal-overlay" id="batchStatusModal">
        <div class="modal">
            <h3>✏️ 批量修改状态</h3>
            <select id="batchNewStatus" style="width:100%; padding:10px; border-radius:5px;">
                <option>未出荷</option><option>已下单未到货</option><option>回国中</option><option>已到货</option><option>可排发</option><option>已排发</option><option>未付款</option>
            </select>
            <button class="btn btn-primary" style="width:100%; margin-top:15px" onclick="executeBatchStatusUpdate()">确认修改</button>
            <button class="btn btn-outline" style="width:100%; margin-top:5px" onclick="document.getElementById('batchStatusModal').style.display='none'">取消</button>
        </div>
    </div>

    <div class="modal-overlay" id="confirmShipModal">
        <div class="modal">
            <h3>✅ 确认发货</h3>
            <p id="shipConfirmInfo" style="font-size:14px; line-height:1.6;"></p>
            <button class="btn btn-primary" style="width:100%" id="finalShipBtn" onclick="executeShipment()">确认已发出</button>
            <button class="btn btn-outline" style="width:100%; margin-top:5px" onclick="document.getElementById('confirmShipModal').style.display='none'">取消</button>
        </div>
    </div>

    <div class="modal-overlay" id="batchImgModal">
        <div class="modal"><h3>🖼️ 批量补图</h3><input type="file" id="batchImgFile" accept="image/*"><button class="btn btn-primary" style="width:100%; margin-top:15px" onclick="executeBatchImgUpdate()">✅ 确认补图</button></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oknhlfhdqbsukskdxqre.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmhsZmhkcWJzdWtza2R4cXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzI1NDEsImV4cCI6MjEwMjA0ODU0MX0.9eoLga8ACXUx66A0SVPZtv1So0bD4YYa5eYP9gFCD_Y';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentData = null, currentUser = null, currentSearchKey = '', currentShipAppIndex = -1;
        let selectedIds = new Set();
        let transferTargetId = null;

        async function checkAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('debug-bar').style.display='none'; return; }
            currentUser = user;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;
            const { data } = await supabaseClient.from('leader_data').select('*');
            if (data && data[0]) { currentData = data[0]; renderUI(); document.getElementById('debug-bar').style.display='none'; }
        }

        async function login() { 
            const { error } = await supabaseClient.auth.signInWithPassword({ email:document.getElementById('email').value, password:document.getElementById('pw').value });
            if (error) alert(error.message); else location.reload();
        }
        async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); if(b.dataset.tab === t) b.classList.add('active'); });
            document.getElementById('tab-' + t).classList.remove('hidden');
            if(t === 'shipping') renderShippingWorkbench();
            if(t === 'logs') renderLogs();
        }

        function toggleSelectAll(checked) {
            const boxes = document.querySelectorAll('.item-checkbox');
            boxes.forEach(b => { b.checked = checked; updateSelection(b.dataset.id, checked); });
        }
        function updateSelection(id, checked) {
            if (checked) selectedIds.add(id); else selectedIds.delete(id);
            const bar = document.getElementById('batchBar');
            if (selectedIds.size > 0) { bar.classList.remove('hidden'); document.getElementById('selectedTip').innerText = `已选择 ${selectedIds.size} 条记录`; }
            else bar.classList.add('hidden');
        }

        function openTransferModal(id) {
            transferTargetId = id;
            document.getElementById('transferTitle').innerText = id ? "🔄 谷子转单" : `🔄 批量转单 (${selectedIds.size} 条)`;
            document.getElementById('transferModal').style.display = 'flex';
        }
        async function executeTransfer() {
            const newCN = document.getElementById('newCN').value.trim();
            const note = document.getElementById('transferNote').value.trim();
            if (!newCN) return alert("写下新 CN 哦");
            let groupData = [...currentData.group_data];
            let logs = (currentData.image_data && currentData.image_data.transfer_logs) || [];
            const ids = transferTargetId ? [transferTargetId] : Array.from(selectedIds);
            ids.forEach(id => {
                const idx = groupData.findIndex(i => i.item_id === id);
                if (idx > -1) {
                    logs.push({ item_name: groupData[idx].name, from_cn: groupData[idx].cn, to_cn: newCN, time: new Date().toISOString(), note: note, operator: currentUser.email });
                    groupData[idx].cn = newCN;
                }
            });
            const { error } = await supabaseClient.from('leader_data').update({ group_data: groupData, image_data: { ...currentData.image_data, transfer_logs: logs } }).eq('query_key', currentData.query_key);
            if (!error) location.reload();
        }

        async function executeBatchStatusUpdate() {
            const newStatus = document.getElementById('batchNewStatus').value;
            let groupData = [...currentData.group_data];
            groupData.forEach(item => { if(selectedIds.has(item.item_id)) item.status = newStatus; });
            const { error } = await supabaseClient.from('leader_data').update({ group_data: groupData }).eq('query_key', currentData.query_key);
            if (!error) location.reload();
        }

        let shipViewMode = 'pending';
        function toggleShipView(mode) { shipViewMode = mode; renderShippingWorkbench(); }
        
        function renderShippingWorkbench() {
            const apps = (currentData.image_data && currentData.image_data.applications) || [];
            const pending = apps.filter(a => a.status === '待处理');
            const done = apps.filter(a => a.status === '已发货');
            document.getElementById('pendingShipCount').innerText = pending.length;
            document.getElementById('completedShipCount').innerText = done.length;

            const target = (shipViewMode === 'pending' ? pending : done).sort((a,b) => new Date(b.time) - new Date(a.time));
            const tbody = document.getElementById('shipBody');
            
            if(target.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#999">🎉 当前没有记录</td></tr>`; return; }

            tbody.innerHTML = target.map(app => {
                const itemsDesc = app.items.map(i => `${i.name} x${i.quantity}`).join('<br>');
                const op = shipViewMode === 'pending' 
                    ? `<button class="btn btn-primary" onclick="openShipConfirm('${app.time}', '${app.cn}')">确认发货</button>` 
                    : `<div style="display:flex; flex-direction:column; gap:5px;"><small>完成：${new Date(app.completed_time).toLocaleDateString()}</small><button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger); padding:2px; font-size:11px" onclick="deleteCompletedShipRecord('${app.time}','${app.cn}')">🗑️ 删除记录</button></div>`;
                return `<tr><td>${new Date(app.time).toLocaleString()}</td><td><b>${app.cn}</b></td><td>${itemsDesc}</td><td>${app.note || '-'}</td><td>${op}</td></tr>`;
            }).join('');
        }

        async function deleteCompletedShipRecord(time, cn) {
            if(!confirm("⚠️ 确认删除这条排发记录？\n\n注意：同时会从排表记录中移除对应的谷子，此操作不可恢复。")) return;
            
            // 1. 找到那条申请记录
            const apps = (currentData.image_data && currentData.image_data.applications) || [];
            const targetApp = apps.find(a => a.time === time && a.cn === cn);
            if(!targetApp) return alert("记录不存在");

            // 2. 获取要删除的 item_id 集合
            const itemIdsToDelete = new Set(targetApp.items.map(i => i.item_id));

            // 3. 从全团数据 group_data 中移除这些谷子
            let newGroupData = currentData.group_data.filter(item => !itemIdsToDelete.has(item.item_id));

            // 4. 从申请记录 applications 中移除这一条
            let newApps = apps.filter(a => !(a.time === time && a.cn === cn));

            // 5. 保存到 Supabase
            const { error } = await supabaseClient.from('leader_data').update({ 
                group_data: newGroupData, 
                image_data: { ...currentData.image_data, applications: newApps } 
            }).eq('query_key', currentData.query_key);

            if (!error) {
                alert("✅ 记录与对应谷子已同步删除！");
                location.reload();
            } else {
                alert("操作失败");
            }
        }

        function openShipConfirm(time, cn) {
            const apps = currentData.image_data.applications;
            currentShipAppIndex = apps.findIndex(a => a.time === time && a.cn === cn);
            const app = apps[currentShipAppIndex];
            document.getElementById('shipConfirmInfo').innerHTML = `确认已为 <strong>${app.cn}</strong> 发出以下谷子吗？<br><br>${app.items.map(i => `• ${i.name} x${i.quantity}`).join('<br>')}`;
            document.getElementById('confirmShipModal').style.display = 'flex';
        }

        async function executeShipment() {
            const apps = [...currentData.image_data.applications];
            const app = apps[currentShipAppIndex];
            app.status = "已发货"; app.completed_time = new Date().toISOString();
            let groupData = [...currentData.group_data];
            const ids = app.items.map(i => i.item_id);
            groupData.forEach(item => { if(ids.includes(item.item_id)) item.status = "已排发"; });
            const { error } = await supabaseClient.from('leader_data').update({ group_data: groupData, image_data: { ...currentData.image_data, applications: apps } }).eq('query_key', currentData.query_key);
            if (!error) location.reload();
        }

        function renderUI() {
            document.getElementById('dispKey').innerText = currentData.query_key;
            let list = currentData.group_data || [];
            if (currentSearchKey) {
                const k = currentSearchKey.toLowerCase();
                list = list.filter(i => (i.cn||"").toLowerCase().includes(k) || (i.name||"").toLowerCase().includes(k));
            }
            const total = list.reduce((s, i) => s + (parseFloat(i.price) * parseInt(i.quantity)), 0);
            document.getElementById('statsArea').innerHTML = `<span class="stats-badge">项数: ${list.length}</span><span class="stats-badge">金额: ￥${total.toFixed(2)}</span>`;
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = list.slice().reverse().map(item => `
                <tr style="${item.status==='已排发'?'opacity:0.5':''}">
                    <td><input type="checkbox" class="item-checkbox" data-id="${item.item_id}" onchange="updateSelection('${item.item_id}', this.checked)"></td>
                    <td><img src="${item.image_url ? item.image_url+'?width=80' : ''}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;"></td>
                    <td>${item.name}</td><td>${item.cn}</td><td>￥${item.price}x${item.quantity}</td>
                    <td><span class="stats-badge" style="margin:0">${item.status}</span></td>
                    <td><button class="btn btn-outline" style="padding:2px; font-size:11px" onclick="editItem('${item.item_id}')">改</button><button class="btn btn-outline" style="padding:2px; font-size:11px" onclick="openTransferModal('${item.item_id}')">转</button></td>
                </tr>`).join('');
        }

        async function previewImport() {
            const raw = document.getElementById('csvInput').value.trim();
            if(!raw) return;
            const lines = raw.split('\n').filter(l => l.trim());
            const itemNames = lines[2].split('\t').slice(2);
            const prices = lines[3].split('\t').slice(2).map(p => parseFloat(p.replace(/[¥,]/g, '')) || 0);
            let items = [];
            for(let i = 5; i < lines.length; i++){
                const cells = lines[i].split('\t');
                const cn = cells[1]?.trim();
                if(!cn || cn === "昵称/总数") continue;
                itemNames.forEach((name, idx) => {
                    const qty = parseInt(parseFloat(cells[idx+2]));
                    if(qty > 0) items.push({ item_id: Date.now()+'_'+Math.random().toString(36).substr(2,4), name: name.trim(), country:"日本", price: prices[idx], quantity: qty, cn, status: "未出荷", image_url: "", created_at: new Date().toISOString() });
                });
            }
            const newList = [...(currentData.group_data || []), ...items];
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        async function saveItem() {
            const newItem = {
                item_id: document.getElementById('editItemId').value || Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: document.getElementById('itemName').value,
                cn: document.getElementById('itemCN').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                quantity: parseInt(document.getElementById('itemQty').value) || 1,
                status: document.getElementById('itemStatus').value,
                country: "日本",
                image_url: "",
                created_at: new Date().toISOString()
            };
            let newList = [...(currentData.group_data || [])];
            const idx = newList.findIndex(i => i.item_id === newItem.item_id);
            if (idx > -1) { newItem.image_url = newList[idx].image_url; newList[idx] = newItem; } else newList.push(newItem);
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key);
            location.reload();
        }

        function editItem(id) {
            const item = currentData.group_data.find(i => i.item_id === id);
            document.getElementById('editItemId').value = item.item_id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCN').value = item.cn;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemQty').value = item.quantity;
            document.getElementById('itemStatus').value = item.status;
            window.scrollTo(0,0);
        }

        function renderLogs() {
            const logs = (currentData.image_data && currentData.image_data.transfer_logs) || [];
            document.getElementById('transferLogsList').innerHTML = logs.slice().reverse().map(l => `<div style="border-bottom:1px solid #eee; padding:5px;">[${new Date(l.time).toLocaleString()}] <b>${l.item_name}</b>: ${l.from_cn} -> ${l.to_cn} (${l.note || '-'})</div>`).join('');
        }

        function batchDeleteItems() {
            if(!confirm(`确认彻底删除这 ${selectedIds.size} 条记录吗？`)) return;
            supabaseClient.from('leader_data').update({ group_data: currentData.group_data.filter(i => !selectedIds.has(i.item_id)) }).eq('query_key', currentData.query_key).then(() => location.reload());
        }

        function applySearchFilter() { currentSearchKey = document.getElementById('universalSearchInput').value; renderUI(); }
        function openBatchImgModal() { document.getElementById('batchImgModal').style.display='flex'; }
        async function executeBatchImgUpdate() {
            const file = document.getElementById('batchImgFile').files[0];
            const fileName = `${Date.now()}_batch_${file.name}`;
            await supabaseClient.storage.from('images').upload(fileName, file);
            const url = `${SUPABASE_URL}/storage/v1/object/public/images/${fileName}`;
            let newList = [...currentData.group_data];
            newList.forEach(i => { if((i.cn||"").toLowerCase().includes(currentSearchKey.toLowerCase()) || (i.name||"").toLowerCase().includes(currentSearchKey.toLowerCase())) i.image_url = url; });
            await supabaseClient.from('leader_data').update({ group_data: newList }).eq('query_key', currentData.query_key).then(() => location.reload());
        }

        checkAuth();
    </script>
</body>
</html>
