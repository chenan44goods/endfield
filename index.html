<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>谷团查单 · 团员自查</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --pink-1:#fff0f6;
    --pink-2:#ffd6e8;
    --pink-3:#ff9ec7;
    --purple-1:#e7d9ff;
    --purple-2:#b48cff;
    --purple-3:#8a5cf6;
    --ink:#5a3d63;
    --ink-soft:#9c7fa8;
    --white:#ffffff;
    --shadow: 0 10px 30px rgba(154, 92, 190, 0.18);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 85% 0%, var(--purple-1) 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1) 0%, #f6ecff 100%);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  .hero{
    text-align:center;
    margin-bottom: 22px;
  }
  .hero .badge{
    display:inline-block;
    background: linear-gradient(135deg, var(--purple-3), var(--pink-3));
    color:#fff;
    font-size:12px;
    padding: 4px 14px;
    border-radius: 999px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .hero h1{
    margin: 6px 0 4px;
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(120deg, var(--purple-3), var(--pink-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p{margin:0;color:var(--ink-soft);font-size:13px;}

  .card{
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
    border: 1px solid #ffe3f1;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color: var(--ink-soft);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input{
    width:100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1.5px solid var(--pink-2);
    background: #fffaff;
    font-size:15px;
    color: var(--ink);
    outline:none;
    transition: border-color .15s;
  }
  .field input:focus{border-color: var(--purple-3);}

  .btn{
    width:100%;
    padding: 13px;
    border:none;
    border-radius: 16px;
    background: linear-gradient(120deg, var(--purple-3), var(--pink-3));
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(180, 90, 200, 0.35);
    transition: transform .1s;
  }
  .btn:active{transform: scale(0.98);}
  .btn.secondary{
    background: var(--white);
    color: var(--purple-3);
    border: 1.5px solid var(--purple-2);
    box-shadow:none;
  }
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  .msg{
    text-align:center;
    padding: 30px 10px;
    color: var(--ink-soft);
    font-size:14px;
  }
  .msg.error{color:#d6537a;}

  .stat-row{
    display:flex;
    gap:12px;
    margin-bottom: 16px;
  }
  .stat{
    flex:1;
    background: linear-gradient(135deg, #fff, #fff5fb);
    border: 1.5px solid var(--pink-2);
    border-radius: 16px;
    padding: 12px;
    text-align:center;
  }
  .stat .num{font-size:20px;font-weight:800;color:var(--purple-3);}
  .stat .label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .item{
    display:flex;
    gap:12px;
    padding: 12px 0;
    border-bottom: 1px dashed #ffdcee;
    align-items:center;
  }
  .item:last-child{border-bottom:none;}
  .item img{
    width:56px;height:56px;border-radius:12px;object-fit:cover;
    border: 1.5px solid var(--pink-2);
    cursor:zoom-in;
    background:#f8f2fb;
    flex-shrink:0;
  }
  .item .noimg{
    width:56px;height:56px;border-radius:12px;
    background:#f8f2fb;
    border: 1.5px dashed var(--pink-2);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--ink-soft);
  }
  .item .info{flex:1;min-width:0;}
  .item .name{font-weight:700;font-size:14px;margin-bottom:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .sub{font-size:12px;color:var(--ink-soft);}
  .item .right{text-align:right;flex-shrink:0;}
  .item .price{font-weight:700;font-size:14px;color:var(--purple-3);}
  .status{
    display:inline-block;
    margin-top:4px;
    font-size:10px;
    padding:2px 9px;
    border-radius:999px;
    font-weight:700;
  }
  .status.未出荷{background:#ffe3e3;color:#c94b4b;}
  .status.已到货{background:#fff2cf;color:#b7841a;}
  .status.已发货{background:#dcefff;color:#3a7bd5;}
  .status.已签收{background:#dcf7e3;color:#2f9e5c;}

  .lightbox{
    position:fixed;inset:0;background:rgba(60,20,60,0.75);
    display:none;align-items:center;justify-content:center;
    padding: 24px; z-index:100;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);}

  .apply-toggle{
    text-align:center;font-size:12px;color:var(--purple-3);
    cursor:pointer; text-decoration:underline; margin-top:4px;
  }
  .file-drop{
    border: 1.5px dashed var(--purple-2);
    border-radius:14px;
    padding: 16px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    background:#fbf7ff;
  }
  .preview-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .preview-row img{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--pink-2);}
  select{
    width:100%;padding:12px 14px;border-radius:14px;
    border:1.5px solid var(--pink-2); background:#fffaff;
    font-size:15px;color:var(--ink);
  }
  .footer-tip{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge">谷团 · 团员自查</span>
    <h1>我的排单查询</h1>
    <p>输入团长给你的查询密钥和昵称，查看自己的排单</p>
  </div>

  <div class="card">
    <div class="field">
      <label>查询密钥</label>
      <input id="queryKey" type="text" placeholder="团长发给你的密钥" autocomplete="off" />
    </div>
    <div class="field">
      <label>你的昵称（CN）</label>
      <input id="cnInput" type="text" placeholder="填写和团长登记一致的昵称" autocomplete="off" />
    </div>
    <button class="btn" id="searchBtn" onclick="doSearch()">查 询</button>
  </div>

  <div id="resultArea"></div>

  <div class="card" id="applyCard" style="display:none;">
    <div class="apply-toggle" onclick="toggleApply()" id="applyToggleText">+ 提交交肾截图 / 排发申请</div>
    <div id="applyForm" style="display:none;margin-top:14px;">
      <div class="field">
        <label>申请类型</label>
        <select id="applyType">
          <option value="交肾">交肾（付款凭证）</option>
          <option value="排发">排发申请</option>
        </select>
      </div>
      <div class="field">
        <label>上传截图</label>
        <div class="file-drop">
          <input type="file" id="applyFile" accept="image/*" multiple style="width:100%;" />
          点击选择图片，可多选
        </div>
        <div class="preview-row" id="previewRow"></div>
      </div>
      <button class="btn secondary" id="applySubmitBtn" onclick="submitApply()">提 交 申 请</button>
    </div>
  </div>

  <div class="footer-tip">数据由团长实时维护 · 如有疑问请联系团长</div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" />
</div>

<script>
  // ====== Supabase 连接信息 ======
  const SUPABASE_URL = "https://oknhlfhdqbsukskdxqre.supabase.co";
  const SUPABASE_KEY = "sb_publishable_uW9cgyB0e6zIZCIcIZSlQ_bqm0MeJa";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentQueryKey = "";
  let currentCn = "";
  let uploadedUrls = [];

  function statusClass(s){
    const known = ["未出荷","已到货","已发货","已签收"];
    return known.includes(s) ? s : "未出荷";
  }

  async function doSearch(){
    const queryKey = document.getElementById('queryKey').value.trim();
    const cn = document.getElementById('cnInput').value.trim();
    const resultArea = document.getElementById('resultArea');
    const btn = document.getElementById('searchBtn');

    if(!queryKey || !cn){
      resultArea.innerHTML = `<div class="card"><div class="msg error">请填写查询密钥和昵称哦～</div></div>`;
      document.getElementById('applyCard').style.display = 'none';
      return;
    }

    btn.disabled = true;
    btn.textContent = "查询中...";
    resultArea.innerHTML = `<div class="card"><div class="msg">正在查询，请稍候…</div></div>`;

    try{
      const { data, error } = await supabase.rpc('get_group_by_key', { p_query_key: queryKey });

      if(error){
        resultArea.innerHTML = `<div class="card"><div class="msg error">查询失败：${escapeHtml(error.message)}</div></div>`;
        document.getElementById('applyCard').style.display = 'none';
        return;
      }

      if(data === null){
        resultArea.innerHTML = `<div class="card"><div class="msg error">没有找到这个查询密钥，请和团长核对一下～</div></div>`;
        document.getElementById('applyCard').style.display = 'none';
        return;
      }

      const list = (Array.isArray(data) ? data : []).filter(it => (it.cn || '').trim() === cn);

      if(list.length === 0){
        resultArea.innerHTML = `<div class="card"><div class="msg error">没有找到「${escapeHtml(cn)}」的排单记录，请确认昵称是否与团长登记的一致～</div></div>`;
        document.getElementById('applyCard').style.display = 'none';
        return;
      }

      let totalQty = 0, totalAmount = 0;
      const itemsHtml = list.map(it => {
        const price = Number(it.price) || 0;
        const qty = Number(it.quantity) || 0;
        totalQty += qty;
        totalAmount += price * qty;
        const img = it.image_url
          ? `<img src="${escapeHtml(it.image_url)}" onclick="openLightbox('${escapeHtml(it.image_url)}')" />`
          : `<div class="noimg">无图</div>`;
        return `
          <div class="item">
            ${img}
            <div class="info">
              <div class="name">${escapeHtml(it.name || '未命名谷子')}</div>
              <div class="sub">单价 ¥${price.toFixed(2)} × ${qty}</div>
              <span class="status ${statusClass(it.status)}">${escapeHtml(statusClass(it.status))}</span>
            </div>
            <div class="right">
              <div class="price">¥${(price*qty).toFixed(2)}</div>
            </div>
          </div>
        `;
      }).join('');

      resultArea.innerHTML = `
        <div class="card">
          <div class="stat-row">
            <div class="stat"><div class="num">${totalQty}</div><div class="label">总件数</div></div>
            <div class="stat"><div class="num">¥${totalAmount.toFixed(2)}</div><div class="label">应肾总额</div></div>
          </div>
          ${itemsHtml}
        </div>
      `;

      currentQueryKey = queryKey;
      currentCn = cn;
      document.getElementById('applyCard').style.display = 'block';

    }catch(e){
      resultArea.innerHTML = `<div class="card"><div class="msg error">出错了：${escapeHtml(e.message || String(e))}</div></div>`;
    }finally{
      btn.disabled = false;
      btn.textContent = "查 询";
    }
  }

  function openLightbox(url){
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }

  function toggleApply(){
    const form = document.getElementById('applyForm');
    const text = document.getElementById('applyToggleText');
    const open = form.style.display !== 'none';
    form.style.display = open ? 'none' : 'block';
    text.textContent = open ? '+ 提交交肾截图 / 排发申请' : '− 收起申请表单';
  }

  document.getElementById('applyFile').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    const previewRow = document.getElementById('previewRow');
    previewRow.innerHTML = '';
    uploadedUrls = [];
    if(files.length === 0) return;

    previewRow.innerHTML = `<span style="font-size:11px;color:var(--ink-soft);">上传中…</span>`;

    for(const file of files){
      try{
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `applications/${currentQueryKey || 'unknown'}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error: upErr } = await supabase.storage.from('images').upload(path, file);
        if(upErr){ continue; }
        const { data: pub } = supabase.storage.from('images').getPublicUrl(path);
        uploadedUrls.push(pub.publicUrl);
      }catch(err){ /* skip failed file */ }
    }

    previewRow.innerHTML = uploadedUrls.map(u => `<img src="${escapeHtml(u)}" />`).join('') ||
      `<span style="font-size:11px;color:#d6537a;">上传失败，请重试</span>`;
  });

  async function submitApply(){
    const btn = document.getElementById('applySubmitBtn');
    if(!currentQueryKey || !currentCn){
      alert('请先完成查询');
      return;
    }
    if(uploadedUrls.length === 0){
      alert('请先上传截图');
      return;
    }
    const type = document.getElementById('applyType').value;

    btn.disabled = true;
    btn.textContent = '提交中...';

    try{
      const payload = {
        type,
        cn: currentCn,
        images: uploadedUrls,
        time: new Date().toISOString(),
        status: '待确认'
      };
      const { error } = await supabase.rpc('submit_application', {
        p_query_key: currentQueryKey,
        p_data: payload
      });
      if(error){
        alert('提交失败：' + error.message);
      }else{
        alert('提交成功，等待团长确认～');
        document.getElementById('applyFile').value = '';
        document.getElementById('previewRow').innerHTML = '';
        uploadedUrls = [];
        toggleApply();
      }
    }catch(e){
      alert('出错了：' + (e.message || e));
    }finally{
      btn.disabled = false;
      btn.textContent = '提 交 申 请';
    }
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  // 回车键直接查询
  document.getElementById('cnInput').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  document.getElementById('queryKey').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
